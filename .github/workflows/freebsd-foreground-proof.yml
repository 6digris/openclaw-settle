  SOURCE_PINS: '{"docs/install/updating.md":"b41e4e0a2f63e0f4e640579507564ce110cf9581fa897559399d9faccc4bb12d","package.json":"16aeb001938403a68674fdfdadf13984c94084967a45381a259cf777f87c2b35","pnpm-lock.yaml":"9edb4d105307320cfa8364ac0171e004d11ba14def46daaf743a6cb54c901ecb","scripts/freebsd-service-inspect.mjs":"6585523afc1b700b82b53e4b9881944a0f3d58f2dd47c5675252ec658a3a8f4d","scripts/lib/freebsd-service-discovery.d.mts":"efb110b8164077569df27bb8a4ba931180d9438a6ae045cdd03752c26f75ba1f","scripts/lib/freebsd-service-discovery.mjs":"a18f1ba7022576545571ef033a0060c83343d8a047e380aec15e3dc0543e0d19","scripts/test-freebsd-service-inspect.mjs":"29a3673d032fba4511b48091fd0eb19a03fc943e361542fda79046b9bdb5f7cd","src/cli/update-cli/shared.ts":"3977c0baffbd9f2a5b320b9a8553100a65bd8b57c468a475743e0e7fb44e4d2d","src/cli/update-cli/update-command-freebsd-admission.test.ts":"18082c958fa6b01aa4de305799c434f6e404f0afe1e6be36b588e31b7a7750c5","src/cli/update-cli/update-command-freebsd-finalization.test.ts":"5452a014e6d139b1d6ba06cffa31361d8aa2f034078af752cc3e89ecb93bdfcd","src/cli/update-cli/update-command-freebsd-pkg.test.ts":"9b95af636a3b5ae379e8afd932a2f1e91b57f093f556fb42c92c3ce6d85b7c45","src/cli/update-cli/update-command-freebsd-preparation.test.ts":"2afb71c05134d90953492d953c16554586bfd4e6919dce1e30bbcbc626224080","src/cli/update-cli/update-command-freebsd-service-admission.test.ts":"c2abb9cd6a2c327910aa3b9c498b4c25215b29f54fcb448ba9f490594abb5b37","src/cli/update-cli/update-command-freebsd-worker.test.ts":"a2db6cb9a892d207283a29d709493152796ff38e25836b6e8140d182df0dcd15","src/cli/update-cli/update-command-fresh-doctor.test.ts":"1bc237ecbae160ee0b45412b938efd2d0c8272304329c7d8cb8104b20d449a7f","src/cli/update-cli/update-command-fresh-preview.test.ts":"5234fe50b81233e0de706b3e3bd2c121b9b048dea643c884fea808eeae8aa053","src/cli/update-cli/update-command-fresh.test-support.ts":"25316d5ed8a2af330101c6253428efa6b06dccea969df3e39998ce04f28f64ea","src/cli/update-cli/update-command