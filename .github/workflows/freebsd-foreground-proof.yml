jobs:
  linux:
    if: github.repository == 'openclaw/openclaw' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 149882 && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.ref == 'feat/freebsd-foreground-update' && github.event.pull_request.user.login == 'vincentkoc'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    outputs:
      fixture_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      fixture_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 5
          persist-credentials: false
      - name: Bind consumer, unchanged product and successful original producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONSUMER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse "$HARNESS_SHA^{tree}")" = "$PRODUCER_TREE"
          test "$(git show -s --format=%P "$HARNESS_SHA")" = "8a7b543c3a7ce59fe13535261b981f599dee9e16"
          test "$(git show -s --format=%P 8a7b543c3a7ce59fe13535261b981f599dee9e16)" = "5889eadd38e98d3d2640969a793b266a56115e39 $SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          git merge-base --is-ancestor "$COMPARISON_BASE" "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          consumer_blob="$(git rev-parse --verify "$CONSUMER_SHA:.github/workflows/freebsd-foreground-proof.yml")"
          workflow_blob="$(git rev-parse --verify "$WORKFLOW_SHA:.github/workflows/freebsd-foreground-proof.yml")"
          test "$consumer_blob" = "$workflow_blob"
          python3 - <<'AUTH'
          import json, os, subprocess
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          repo=os.environ['PROOF_REPOSITORY'];run=api(f"repos/{repo}/actions/runs/{os.environ['PROOF_RUN_ID']}")
          assert run['head_sha']==os.environ['HARNESS_SHA'] and run['run_attempt']==int(os.environ['PROOF_RUN_ATTEMPT'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/sqlite-transaction-boundary-proof.yml'
          artifact=api(f"repos/{repo}/actions/artifacts/{os.environ['PAYLOAD_ARTIFACT_ID']}")
          assert str(artifact['id'])==os.environ['PAYLOAD_ARTIFACT_ID'] and not artifact['expired']
          assert artifact['workflow_run']['id']==int(os.environ['PROOF_RUN_ID'])
          assert artifact['workflow_run']['head_sha']==os.environ['HARNESS_SHA']
          assert artifact['size_in_bytes']==int(os.environ['PAYLOAD_ARTIFACT_SIZE'])
          assert artifact['digest']==os.environ['PAYLOAD_ARTIFACT_DIGEST']
          print(json.dumps(dict(consumer=os.environ['CONSUMER_SHA'],workflow=os.environ['WORKFLOW_SHA'],syntheticMerge=os.environ['GITHUB_SHA'],producer=os.environ['HARNESS_SHA'],run=run['id'],attempt=run['run_attempt'],artifact=artifact['id'],digest=artifact['digest'])))
          AUTH
          git switch --detach "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ env.PROOF_RUN_ID }}
          artifact-ids: ${{ env.PAYLOAD_ARTIFACT_ID }}
          digest-mismatch: error
          path: proof-input
          merge-multiple: true
      - name: Set up the verifier runtime without installing dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Verify the original successful seal before consuming its package
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts verify \
            --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
            --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
            --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA" \
            --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA" \
            --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const r=JSON.parse(fs.readFileSync('proof-input/complete.json'));
