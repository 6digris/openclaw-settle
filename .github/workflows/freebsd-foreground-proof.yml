# Temporary source-bound qualification; remove after native proof.
name: Temporary FreeBSD foreground update proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: freebsd-foreground-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  COMPARISON_BASE: 351ff29013b53ca90977058fdeb1af0a1dc33bec
  EXPECTED_PRODUCT_TREE: 3e52f2de5cadea5927b8b35c0c2e5c534c35e92d
  SOURCE_PINS: '{"docs/install/updating.md":"b41e4e0a2f63e0f4e640579507564ce110cf9581fa897559399d9faccc4bb12d","package.json":"16aeb001938403a68674fdfdadf13984c94084967a45381a259cf777f87c2b35","pnpm-lock.yaml":"9edb4d105307320cfa8364ac0171e004d11ba14def46daaf743a6cb54c901ecb","scripts/freebsd-service-inspect.mjs":"6585523afc1b700b82b53e4b9881944a0f3d58f2dd47c5675252ec658a3a8f4d","scripts/lib/freebsd-service-discovery.d.mts":"efb110b8164077569df27bb8a4ba931180d9438a6ae045cdd03752c26f75ba1f","scripts/lib/freebsd-service-discovery.mjs":"a18f1ba7022576545571ef033a0060c83343d8a047e380aec15e3dc0543e0d19","scripts/test-freebsd-service-inspect.mjs":"29a3673d032fba4511b48091fd0eb19a03fc943e361542fda79046b9bdb5f7cd","src/cli/update-cli/shared.ts":"3977c0baffbd9f2a5b320b9a8553100a65bd8b57c468a475743e0e7fb44e4d2d","src/cli/update-cli/update-command-freebsd-admission.test.ts":"18082c958fa6b01aa4de305799c434f6e404f0afe1e6be36b588e31b7a7750c5","src/cli/update-cli/update-command-freebsd-finalization.test.ts":"5452a014e6d139b1d6ba06cffa31361d8aa2f034078af752cc3e89ecb93bdfcd","src/cli/update-cli/update-command-freebsd-pkg.test.ts":"9b95af636a3b5ae379e8afd932a2f1e91b57f093f556fb42c92c3ce6d85b7c45","src/cli/update-cli/update-command-freebsd-preparation.test.ts":"2afb71c05134d90953492d953c16554586bfd4e6919dce1e30bbcbc626224080","src/cli/update-cli/update-command-freebsd-service-admission.test.ts":"c2abb9cd6a2c327910aa3b9c498b4c25215b29f54fcb448ba9f490594abb5b37","src/cli/update-cli/update-command-freebsd-worker.test.ts":"a2db6cb9a892d207283a29d709493152796ff38e25836b6e8140d182df0dcd15","src/cli/update-cli/update-command-fresh-doctor.test.ts":"1bc237ecbae160ee0b45412b938efd2d0c8272304329c7d8cb8104b20d449a7f","src/cli/update-cli/update-command-fresh-preview.test.ts":"5234fe50b81233e0de706b3e3bd2c121b9b048dea643c884fea808eeae8aa053","src/cli/update-cli/update-command-fresh.test-support.ts":"25316d5ed8a2af330101c6253428efa6b06dccea969df3e39998ce04f28f64ea","src/cli/update-cli/update-command-initialization.ts":"14f1c43b85dd5c66d7b4d9b0f73da373d458d04ee84fb567d8007d167b130dbd","src/cli/update-cli/update-command-migrated-types.ts":"4e3d893815ef1a7bd4b5412c41c4517ad366cc1159ffc3159d0f2a74480bd1a3","src/cli/update-cli/update-command-migrated.ts":"0e9cb2823c34986ebe92e47ea7b3090757b3904ff28db4b5dca0c76ad5c3a7c6","src/cli/update-cli/update-command-mutable-signals.test.ts":"3d6fe8444c68c4f6a7b9e1d5df8daf695df573919d758f5953e1ae2cc94756fa","src/cli/update-cli/update-command-mutable-signals.ts":"6b7ff11ed421ea9ed76179bfc6271d8e1b26e5164b5e2e27a8a6731e5cfce383","src/cli/update-cli/update-command-post-core.ts":"c0a7cf699f4a703132dc3687fc65f6dcb97466e3346f298712aa5085335858a2","src/cli/update-cli/update-command-post-update.test.ts":"cbda141099a15522e3a1fd379ed6ad4cc53703e4b21676a033d8c8b28d4d912a","src/cli/update-cli/update-command-post-update.ts":"277ea81d7204237b4c08233a8455597358557847164b3d7e4a68bb84f7ba0f41","src/cli/update-cli/update-command-recovery.ts":"02c6d1c07c18d72426897bd2b73de71a78cb73a059496ae7a8ba96261b59273a","src/cli/update-cli/update-command-repair.ts":"20883d37e0cf2d60b44b3f3999e8754f34e03fe06e02e86f1752bc46d969cba3","src/cli/update-cli/update-command-result.ts":"00b4b6fbbc545b90e57dadce8f3190fd3288265df5fad24817622e135dcc19fe","src/cli/update-cli/update-command-run.ts":"6ab0278d910bc33dea9629787ccd2a670009106829e58128dc958ebc4b2d8185","src/cli/update-cli/update-command-runtime-preview.test.ts":"c89f35b9ce05c50caea7d96a6567cdde8de88ca47a3f930c8a48575a70144234","src/cli/update-cli/update-command-schema.ts":"544779797714b4b407dd4b0de9502652c98fd33c36479038fe0f065f4e0d9e2f","src/cli/update-cli/update-command-sentinel-env.test.ts":"5438a724cb5c947e39e87adef16d47bc97ff4a012ee00446203bdfa03f1e9760","src/cli/update-cli/update-command-service-plan.ts":"bd080b2b35b292b0df06a4422b9f0ae82da8bd8a036b60c02986487742d23af8","src/cli/update-cli/update-command-service-publication.test.ts":"3b831db007b518bfd4ae383f794680f8717dead0d1172d76db10d01515fa6e8a","src/cli/update-cli/update-command-service-publication.ts":"69773c407b5b9701826f39d44949f504da210d8d83fd8ca108b62831a27b86a5","src/cli/update-cli/update-command-terminal.ts":"ea417b2ac7124348f2c1f2cd1e8d577f9627049534223b3ac93497d17816d465","src/cli/update-cli/update-command-timeouts.test.ts":"5d93b759adb0ad127fd001c2b2fc71d92954e157178ede8c4ce452d711e5c5ba","src/cli/update-cli/update-command-triage.ts":"8384e0a8dd2c08baf8f252e2ae8a0fb745a8bab767a6e5bc993ed3ef8fb97866","src/cli/update-cli/update-command-unwind.ts":"8749e3c7dae9b659d14d3dce2347e8e3c5ecddac9fd7ab5633d69057386faf3e","src/cli/update-cli/update-command.ts":"66874fda6e01c1db7f7f0ae3bf52f249f28b99f1b5cadc3e009417076692cb1e","src/cli/update-cli/update-finalization-lifecycle.test.ts":"56cb2fd13aefecf8ba4ea4521646d0dc2376529cc21e9e558353926bbc93a89e","src/cli/update-cli/update-finalization-lifecycle.ts":"6ab7e57866f2feb78c0eedddcbdd9d0420d6c6fc423950452b40bcd8a7730bee","src/commands/doctor-gateway-daemon-flow.test.ts":"f5218bc2c1f7b1c9e4e21f4e2c7f2a8b11e5a07b1966a2dc6dd67163dc28a8f2","src/commands/doctor-gateway-daemon-flow.ts":"ba6fd300417e70ae92da69876e5a7ec98fd4162105cefd0956ef1f3e72e1eefd","src/commands/doctor-maintenance.freebsd.test.ts":"9f49acb41548936dcc06d2f7f9bfaf547a4f3415a431a72e8f398c2333e3f6c4","src/daemon/freebsd-service.ts":"f1bedd417dd343752cfd6798deab0aecd563ec47f5fbdb2f28adc2f77467d210","src/daemon/service-operation-lock.test.ts":"cff92fd2b7e7fe5114b5308c4662add0f5445acad753ba6b79f45df99bdb1089","src/daemon/service-operation-lock.ts":"caf9cd0351d039f97bd36c5dbfc8e7cc05cc4a1e5489912dafed027a632751e8","src/daemon/service.test.ts":"c2fcceab8afd85fa41dd46810bebd4ac4ce2b6c54f8464ef0d713c30a10d3eda","src/daemon/service.ts":"1267c7eed02ed48d3ec2fe4f7f76f42ce0bebe7fce578ac8e1de18cb7295f4ab","src/flows/doctor-core-checks.runtime.test.ts":"cb414006b7f05eefe37afe61ba07ec5e9881b15b9bebd3e4828e9d587955ce89","src/flows/doctor-core-checks.runtime.ts":"c7667f8cef7dc5ed58c20c3365246d9f843e4a9b640818eaa248f81613173943","src/infra/update-control-plane-sentinel.ts":"624f4006ddbbeeeed5661c8f0c5af6d65d8bee65d3c99bca4857328428d47c35","src/infra/update-freebsd-root-ownership.test-support.ts":"0307ead5caf5f7f166ece67d27326010c0acf4bc1d880795f854b8ad5c1b2707","src/infra/update-freebsd-root-ownership.test.ts":"cb1a10f941bd6b421f13e6e23e4a354f9cb94ee142180c1f268223ff63e1df3e","src/infra/update-freebsd-root-ownership.ts":"02bb83fa9f063c5f9e3f268f69b463f0750ddf37dde71177d362df63fb80c6d5","src/infra/update-migrated-finalize.worker.ts":"e7a3d1920b35ec70731038046275d97308b78a9ec18feccdb372ef74de02163f","src/shared/deferred.ts":"2fd613018154ee1ab3e43d183d9f0c770d286dfef05562f1493cd9674545b884","test/helpers/promise.ts":"d75c9eccf22619f2967aa5ded98f4cf230effee63390bd8a2c4c52df37a162be"}'

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/freebsd-foreground-update'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      source_archive_sha256: ${{ steps.seal.outputs.source_archive_sha256 }}
      package_version: ${{ steps.seal.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - &identity
        name: Verify reviewed source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$COMPARISON_BASE" HEAD
          test "$(git rev-parse 'HEAD^1^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'), expected, file);
            console.log(`${expected}  ${file}`);
          }
          NODE
      - name: Set up frozen build dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      # Run 35077651222/attempt 1/job 104733758806 passed the remaining types, i18n,
      # core lint stripes 2/3/5, all plugin shards and script lint. Only the five
      # files below differ. Recheck their owners and the failed/unreached gates;
      # final source-only CI still runs the complete required pipeline.
      - name: Check the repaired lint boundaries
        run: |
          set -euo pipefail
          test "$(git diff --name-only 031fcc7d612615a3968bf483a8c54978773061e8 HEAD -- . ':(exclude).github/workflows/freebsd-foreground-proof.yml')" = "$(printf '%s\n' src/cli/update-cli/update-command-freebsd-admission.test.ts src/cli/update-cli/update-command-freebsd-pkg.test.ts src/cli/update-cli/update-command-freebsd-service-admission.test.ts src/infra/update-freebsd-root-ownership.test.ts src/infra/update-migrated-finalize.worker.ts)"
          pnpm format:check --no-error-on-unmatched-pattern -- src/cli/update-cli/update-command-freebsd-admission.test.ts src/cli/update-cli/update-command-freebsd-pkg.test.ts src/cli/update-cli/update-command-freebsd-service-admission.test.ts src/infra/update-freebsd-root-ownership.test.ts src/infra/update-migrated-finalize.worker.ts
          pnpm check:no-conflict-markers
          pnpm check:max-lines-ratchet --base "$COMPARISON_BASE"
          pnpm check:assertion-safety --base "$COMPARISON_BASE"
      - name: Check changed production and test owners
        run: |
          set -euo pipefail
          pnpm tsgo:core
          node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/cli/update-cli/update-command-freebsd-admission.test.ts","src/cli/update-cli/update-command-freebsd-pkg.test.ts","src/cli/update-cli/update-command-freebsd-service-admission.test.ts","src/infra/update-freebsd-root-ownership.test.ts"]'
      - name: Resume failed core lint stripes
        run: |
          set -euo pipefail
          pnpm lint:core --split-core --core-stripe=1/5
          pnpm lint:core --split-core --core-stripe=4/5
      - name: Run unreached styles and import-cycle checks
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/run-stylelint.mts 'ui/src/**/*.css' 'ui/src/**/*.ts' 'ui/public/themes/*.css'
          pnpm check:import-cycles
      - name: Build and pack the candidate once
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=openclaw/ "$SOURCE_SHA" > "$RUNNER_TEMP/source.tar.gz"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog             --output-dir "$RUNNER_TEMP/candidate-package" --output-name candidate.tgz             --pack-json "$RUNNER_TEMP/candidate-pack.json"
      - name: Linux control and existing updater owners
        run: |
          set -euo pipefail
          # Require all seven maintenance cases (three admission, four repair refusals).
          # The unchanged daemon-flow file has four fewer cases after their relocation.
          node scripts/run-vitest.mjs \
            src/cli/update-cli/update-command-initialization.test.ts \
            src/cli/update-cli/update-command-artifact.test.ts \
            src/cli/update-cli/update-command-freebsd-admission.test.ts \
            src/cli/update-cli/update-command-freebsd-pkg.test.ts \
            src/cli/update-cli/update-command-fresh-preview.test.ts \
            src/cli/update-cli/update-command-mutable-signals.test.ts \
            src/cli/update-cli/update-command-service-publication.test.ts \
            src/commands/doctor-gateway-daemon-flow.test.ts \
            src/commands/doctor-maintenance.freebsd.test.ts \
            src/daemon/service-operation-lock.test.ts \
            src/daemon/service.test.ts \
            src/flows/doctor-core-checks.runtime.test.ts \
            src/cli/update-cli/update-command-runtime-preview.test.ts \
            src/cli/update-cli/update-command-timeouts.test.ts \
            src/cli/update-cli/update-command-sentinel-env.test.ts \
            src/cli/update-cli/update-finalization-lifecycle.test.ts \
            src/cli/update-cli/update-command-fresh-doctor.test.ts \
            src/cli/update-cli/update-command-post-update.test.ts
      - *identity
      - name: Seal candidate and metadata-only update target
        id: seal
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts seal             --archive "$RUNNER_TEMP/source.tar.gz"             --package-dir "$RUNNER_TEMP/candidate-package" --output-dir "$RUNNER_TEMP/proof/payload"             --repository "$GITHUB_REPOSITORY" --target-sha "$SOURCE_SHA"             --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$SOURCE_SHA"             --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cp "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/proof/source.tar.gz"
          node scripts/e2e/lib/update-first-hop-package-fixtures.mjs first-hop-tarball             "$RUNNER_TEMP/proof/payload/candidate.tgz" "$RUNNER_TEMP/proof/first-hop.tgz" 0             > "$RUNNER_TEMP/proof/first-hop.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = `${process.env.RUNNER_TEMP}/proof`;
          const receipt = JSON.parse(fs.readFileSync(`${dir}/first-hop.json`));
          assert.equal(receipt.method, 'candidate-same-schema-first-hop-fixture');
          const allowed = ['package.json', 'dist/build-info.json', 'dist/postinstall-content-inventory.json'];
          assert(receipt.members.changes.length >= 2);
          assert(receipt.members.changes.every(change => allowed.includes(change.path) && change.before && change.after));
          const manifest = JSON.parse(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`));
          assert.equal(receipt.sourceSha256, manifest.files.find(file => file.name === 'candidate.tgz').sha256);
          assert.equal(receipt.targetSha256, createHash('sha256').update(fs.readFileSync(`${dir}/first-hop.tgz`)).digest('hex'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${createHash('sha256').update(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`)).digest('hex')}\nsource_archive_sha256=${manifest.sourceArchiveSha256}\npackage_version=${manifest.packageVersion}\n`);
          console.log(JSON.stringify(receipt));
          NODE
      - name: Upload immutable source and packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-foreground-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    needs: package
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/freebsd-foreground-update'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
      ARCHIVE_SHA: ${{ needs.package.outputs.source_archive_sha256 }}
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
      PAYLOAD_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
      PAYLOAD_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/install-smoke-candidate-payload.mts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: proof-input
          merge-multiple: true
      - name: Run native suites and an actual installed update
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 8192
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA SOURCE_PINS EXPECTED_NODE_ARCH MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION PAYLOAD_ARTIFACT_ID PAYLOAD_ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 corepack ca_root_nss git-lite gmake python3 bash
          run: |
            set -eu
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { execFileSync } from 'node:child_process';
            const release = execFileSync('/bin/freebsd-version', ['-u'], { encoding: 'utf8' }).trim();
            assert.match(release, /^15\.1-RELEASE(?:-p\d+)?$/);
            assert.equal(process.platform, 'freebsd');
            assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
            assert.equal(process.getuid(), 0); assert.equal(process.geteuid(), 0);
            assert.match(process.version, /^v24\./);
            console.log(JSON.stringify({ release, platform: process.platform, arch: process.arch, node: process.version, uid: process.getuid(), euid: process.geteuid() }));
            NODE
            node scripts/install-smoke-candidate-payload.mts verify               --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA"               --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION"               --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA"               --harness-repository "$PROOF_REPOSITORY" --harness-sha "$SOURCE_SHA"               --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
            proof_root=$(mktemp -d /root/openclaw-foreground-proof.XXXXXX)
            chmod 0700 "$proof_root"
            INPUT_ROOT="$(pwd)/proof-input"
            export PROOF_ROOT="$proof_root" INPUT_ROOT
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { createHash } from 'node:crypto';
            import fs from 'node:fs';
            const root = process.env.INPUT_ROOT;
            const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(hash(`${root}/source.tar.gz`), process.env.ARCHIVE_SHA);
            const receipt = JSON.parse(fs.readFileSync(`${root}/first-hop.json`));
            assert.equal(hash(`${root}/first-hop.tgz`), receipt.targetSha256);
            assert.equal(hash(`${root}/payload/candidate.tgz`), receipt.sourceSha256);
            console.log(JSON.stringify({ source: process.env.SOURCE_SHA, artifact: process.env.PAYLOAD_ARTIFACT_ID, digest: process.env.PAYLOAD_ARTIFACT_DIGEST, firstHop: receipt }));
            NODE
            mkdir "$proof_root/source" "$proof_root/package-view" "$proof_root/target-view" "$proof_root/reports"
            tar -xzf "$INPUT_ROOT/source.tar.gz" -C "$proof_root/source"
            tar -xzf "$INPUT_ROOT/payload/candidate.tgz" -C "$proof_root/package-view"
            tar -xzf "$INPUT_ROOT/first-hop.tgz" -C "$proof_root/target-view"
            source_root="$proof_root/source/openclaw"
            export SOURCE_ROOT="$source_root" PACKAGED_ROOT="$proof_root/package-view/package"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { createHash } from 'node:crypto';
