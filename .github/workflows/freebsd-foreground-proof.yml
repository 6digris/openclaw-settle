-output.test.ts":"80610d483b1f0a571c31a712267552554b6df66b4bc71c1555aa7fc4286187ce","src/process/exec-input-admission.test.ts":"f9f7ed02a7b4b7aabf34d3c8d7582b0d0521c24ddabc89c0e84fd3cb26184350","src/process/exec-result.ts":"8bcacfd0b9fa8c69c5e659d7076b111ec83ac7fd2885ade9204e85e0c69ce7f8","src/process/exec-runner.ts":"89780a8903a7bb6fce44e193ae3bd9cda33b145ae3a8668f1f0034088d3af77f","src/process/exec-termination.ts":"f2d789806f347701d73fddff08eb196df4911138fdc4bd48de256b5337b5a13c","src/process/supervisor/service-child-group-anchor.preparation.test.ts":"119af0054dd57e13688323c3372e2cd90c3224d373decd344a49472c3bef41f8","src/process/supervisor/service-child-relay-host.awaited-output.test.ts":"930c2d8587472b72bcfbfd4c9cdf9324ab490749f1a4bc02e1864aa776e299dd","src/shared/deferred.ts":"2fd613018154ee1ab3e43d183d9f0c770d286dfef05562f1493cd9674545b884","src/state/openclaw-agent-canonical-validation-schema.test.ts":"b27617dd6b58d327c920de591b327718ca820c4a5e3c4fb11f4be5e2fbdfb5d4","src/state/openclaw-agent-canonical-validation-schema.ts":"c00ddf6c914edea6361face0cc09de27c89cbac0eb15ff5418334ec04c7a95a0","src/state/openclaw-agent-db-contract.ts":"25c4e1bc1a28b401a6daf91a6059545c31e3ae5d5c00b4a6cb5cde27a8575fa5","src/state/openclaw-agent-db-schema.ts":"5a296731043ff4dd68c5318ed7d595863f70694a6bdee55ffe9174fd7027503e","src/state/openclaw-agent-schema.ts":"2711052c19af18a58bea0600b6891c1342ddb5f946fea95ff30f86979c7d1f52","src/state/openclaw-agent-transcript-fts-schema.test.ts":"4bb21d0043b05b902c126c1a0b5920ba272a0221edd15de84448907ff953e980","src/state/openclaw-agent-transcript-fts-schema.ts":"3b0465e02da3afa997117d5250bbda6aa6f987d96c99eddd300a52a66ab7a439","test/helpers/promise.ts":"8087915397301f15e74afe80cb4279a7f75b3eece40d68ea461d5ef85183c1d8","test/vitest/vitest.cli-process-paths.mjs":"cf4f0c8c9b0a47bae346ea778b6b56d685dc56fd5c39d48914c2be58b46bf325","test/vitest/vitest.infra.config.ts":"7192616d28c134b2d0e7ec1a6ca93a662ade4af8c62a1762968aa5b88cb6b52f"}'

jobs:
  package:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/feat/freebsd-foreground-update'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      source_archive_sha256: ${{ steps.seal.outputs.source_archive_sha256 }}
      package_version: ${{ steps.seal.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Bind the workflow-only child to the frozen composition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          git merge-base --is-ancestor "$COMPARISON_BASE" "$SOURCE_SHA"
          git switch --detach "$SOURCE_SHA"
      - &identity
        name: Verify exact source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          for(const [file,digest] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'),digest,file);
            console.log(`${digest}  ${file}`);
          }
          const pkg=JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.dependencies['@openclaw/fs-safe'],'0.17.0');
          assert.match(pkg.packageManager,/^pnpm@12\.4\.0\+/);
          NODE
      - name: Set up frozen build dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
      - name: Check the composed owners and changed paths
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const paths=JSON.parse(process.env.CHANGED_PATHS);
          assert.deepEqual(execFileSync('git',['diff','--name-only',process.env.COMPARISON_BASE,process.env.SOURCE_SHA],{encoding:'utf8'}).trim().split('\n'),paths);
          const args=['scripts/check-changed.mjs','--base',process.env.COMPARISON_BASE,'--head',process.env.SOURCE_SHA];
          execFileSync('node',[...args,'--dry-run','--',...paths],{stdio:'inherit'});
          execFileSync('node',[...args,'--',...paths],{stdio:'inherit'});
          NODE
      - name: Fetch and authenticate the published bootstrap package once
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/published-baseline" "$RUNNER_TEMP/proof"
          # Canonical published-artifact readback; dependency-install cooldowns stay unchanged.
          timeout --preserve-status 300s npm pack openclaw@2026.9.4 --ignore-scripts --json --min-release-age=0 --registry=https://registry.npmjs.org/ \
            --pack-destination "$RUNNER_TEMP/published-baseline" > "$RUNNER_TEMP/published-baseline/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir=`${process.env.RUNNER_TEMP}/published-baseline`;
          const rows=JSON.parse(fs.readFileSync(`${dir}/pack.json`));
          assert.equal(rows.length,1);
          const row=rows[0]; assert.equal(row.name,'openclaw'); assert.equal(row.version,'2026.9.4');
          assert.equal(row.filename,'openclaw-2026.9.4.tgz'); assert.equal(row.integrity,process.env.BASELINE_SRI);
          const bytes=fs.readFileSync(`${dir}/${row.filename}`);
          assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`,process.env.BASELINE_SRI);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/proof/published-2026.9.4.tgz`,bytes,{flag:'wx'});
          console.log(JSON.stringify({publishedBootstrap:'openclaw@2026.9.4',integrity:process.env.BASELINE_SRI,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')}));
          NODE
      # This build creates one fresh package for every platform consumer.
      - name: Build and pack the candidate once
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=openclaw/ "$SOURCE_SHA" > "$RUNNER_TEMP/source.tar.gz"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog             --output-dir "$RUNNER_TEMP/candidate-package" --output-name candidate.tgz             --pack-json "$RUNNER_TEMP/candidate-pack.json"
      - *identity
      - name: Current Linux CLI, Doctor, service and worker controls
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs \
            src/cli/update-cli/update-command-admission.test.ts \
            src/cli/update-cli/update-command-cleanup-recovery.test.ts \
            src/cli/update-cli/update-command-doctor-delegation.test.ts \
            src/cli/update-cli/update-command-execution-validation.test.ts \
            src/cli/update-cli/update-command-execution.rehearsal.test.ts \
            src/cli/update-cli/update-command-foreground.test.ts \
            src/cli/update-cli/update-command-freebsd-admission.test.ts \
            src/cli/update-cli/update-command-freebsd-pkg.test.ts \
            src/cli/update-cli/update-command-fresh-artifact.test.ts \
            src/cli/update-cli/update-command-fresh-preview.test.ts \
            src/cli/update-cli/update-command-initialization.test.ts \
            src/cli/update-cli/update-command-mutable-signals.test.ts \
            src/cli/update-cli/update-command-noop.test.ts \
            src/cli/update-cli/update-command-post-core.test.ts \
            src/cli/update-cli/update-command-recovery.test.ts \
            src/cli/update-cli/update-command-repair.rehearsal.test.ts \
            src/cli/update-cli/update-command-runtime-continuation.test.ts \
            src/cli/update-cli/update-command-service-admission.test.ts \
            src/cli/update-cli/update-command-service-drain.test.ts \
            src/cli/update-cli/update-command-service-maintenance.test.ts \
            src/cli/update-cli/update-command-service-publication.test.ts \
            src/cli/update-cli/update-command-service-selection.test.ts \
            src/cli/update-cli/update-command-terminal-outcome.test.ts \
            src/cli/update-cli/update-command-terminal-record.test.ts \
            src/commands/doctor-gateway-daemon-flow.test.ts \
            src/commands/doctor-maintenance.freebsd.test.ts \
            src/commands/doctor-maintenance.settlement.test.ts \
            src/daemon/service-operation-lock.test.ts \
            src/daemon/service.freebsd.test.ts \
            src/daemon/service.test.ts \
            src/flows/doctor-core-checks.runtime.test.ts \
            src/flows/doctor-gateway-daemon.test.ts \
            src/infra/update-candidate-canary.retention.test.ts \
            src/infra/update-candidate-plugin-tree.test.ts \
            src/infra/update-migrated-finalize.worker.test.ts \
            src/process/decoded-output.test.ts \
            src/process/exec-input-admission.test.ts \
            src/process/supervisor/service-child-group-anchor.preparation.test.ts \
            src/process/supervisor/service-child-relay-host.awaited-output.test.ts
      - *identity
      - name: Seal candidate and metadata-only update target
        id: seal
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts seal             --archive "$RUNNER_TEMP/source.tar.gz"             --package-dir "$RUNNER_TEMP/candidate-package" --output-dir "$RUNNER_TEMP/proof/payload"             --repository "$GITHUB_REPOSITORY" --target-sha "$SOURCE_SHA"             --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$HARNESS_SHA"             --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cp "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/proof/source.tar.gz"
          node scripts/e2e/lib/update-first-hop-package-fixtures.mjs first-hop-tarball             "$RUNNER_TEMP/proof/payload/candidate.tgz" "$RUNNER_TEMP/proof/first-hop.tgz" 0             > "$RUNNER_TEMP/proof/first-hop.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = `${process.env.RUNNER_TEMP}/proof`;
          const receipt = JSON.parse(fs.readFileSync(`${dir}/first-hop.json`));
          assert.equal(receipt.method, 'candidate-same-schema-first-hop-fixture');
          const allowed = ['package.json', 'dist/build-info.json', 'dist/postinstall-content-inventory.json'];
          assert(receipt.members.changes.length >= 2);
          assert(receipt.members.changes.every(change => allowed.includes(change.path) && change.before && change.after));
          const manifest = JSON.parse(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`));
          assert.equal(receipt.sourceSha256, manifest.files.find(file => file.name === 'candidate.tgz').sha256);
          assert.equal(receipt.targetSha256, createHash('sha256').update(fs.readFileSync(`${dir}/first-hop.tgz`)).digest('hex'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${createHash('sha256').update(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`)).digest('hex')}\nsource_archive_sha256=${manifest.sourceArchiveSha256}\npackage_version=${manifest.packageVersion}\n`);
          console.log(JSON.stringify(receipt));
          NODE
      - name: Upload immutable source and packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-foreground-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    needs: package
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/feat/freebsd-foreground-update'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
      ARCHIVE_SHA: ${{ needs.package.outputs.source_archive_sha256 }}
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
      PAYLOAD_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
      PAYLOAD_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: proof-input
          merge-multiple: true
      - *identity
      - name: Authenticate the shared package and published driver
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts verify \
            --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
            --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --target-sha "$SOURCE_SHA" \
            --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$HARNESS_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          assert.equal(`sha512-${createHash('sha512').update(fs.readFileSync('proof-input/published-2026.9.4.tgz')).digest('base64')}`,process.env.BASELINE_SRI);
          console.log(JSON.stringify({source:process.env.SOURCE_SHA,harness:process.env.HARNESS_SHA,artifact:process.env.PAYLOAD_ARTIFACT_ID,digest:process.env.PAYLOAD_ARTIFACT_DIGEST}));
          NODE
      - name: Published driver and candidate first-hop service control
        run: |
          set -euo pipefail
          export OPENCLAW_QA_ALLOW_UPDATE_FIRST_HOP=1
          export OPENCLAW_UPDATE_FIRST_HOP_SOURCE_PACKAGE_TGZ="$PWD/proof-input/published-2026.9.4.tgz"
          export OPENCLAW_UPDATE_FIRST_HOP_CANDIDATE_PACKAGE_TGZ="$PWD/proof-input/payload/candidate.tgz"
          export OPENCLAW_UPDATE_FIRST_HOP_ARTIFACT_DIR="$RUNNER_TEMP/linux-first-hop"
          bash scripts/e2e/update-first-hop-compat-docker.sh
          cat "$OPENCLAW_UPDATE_FIRST_HOP_ARTIFACT_DIR/summary.json"
          echo 'Linux published9.4 first-hop/second-hop proof uses the canonical service shim'
      - *identity

  native:
    needs: [package, linux]
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/feat/freebsd-foreground-update'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
      ARCHIVE_SHA: ${{ needs.package.outputs.source_archive_sha256 }}
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
      PAYLOAD_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
      PAYLOAD_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-foreground-proof.yml
      - name: Verify the workflow-only producer and reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$COMPARISON_BASE" "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/freebsd-foreground-proof.yml'
