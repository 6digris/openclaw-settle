  native:
    needs: [linux]
    if: github.repository == 'openclaw/openclaw' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 149882 && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.ref == 'feat/freebsd-foreground-update' && github.event.pull_request.user.login == 'vincentkoc'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      PROOF_REPOSITORY: ${{ github.repository }}
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 5
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-foreground-proof.yml
      - name: Bind consumer, unchanged product and successful original producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONSUMER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse "$HARNESS_SHA^{tree}")" = "$PRODUCER_TREE"
          test "$(git show -s --format=%P "$HARNESS_SHA")" = "8a7b543c3a7ce59fe13535261b981f599dee9e16"
          test "$(git show -s --format=%P 8a7b543c3a7ce59fe13535261b981f599dee9e16)" = "5889eadd38e98d3d2640969a793b266a56115e39 $SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          git merge-base --is-ancestor "$COMPARISON_BASE" "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          consumer_blob="$(git rev-parse --verify "$CONSUMER_SHA:.github/workflows/freebsd-foreground-proof.yml")"
          workflow_blob="$(git rev-parse --verify "$WORKFLOW_SHA:.github/workflows/freebsd-foreground-proof.yml")"
          test "$consumer_blob" = "$workflow_blob"
          python3 - <<'AUTH'
          import json, os, subprocess
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          repo=os.environ['PROOF_REPOSITORY'];run=api(f"repos/{repo}/actions/runs/{os.environ['PROOF_RUN_ID']}")
          assert run['head_sha']==os.environ['HARNESS_SHA'] and run['run_attempt']==int(os.environ['PROOF_RUN_ATTEMPT'])
