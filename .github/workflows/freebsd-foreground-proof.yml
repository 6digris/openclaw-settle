ed590ee769e27b7b90ff59af9c7fe10343348f95f63d","src/flows/doctor-gateway-daemon.test.ts":"e715797c6c579c38d1af9308e1074e0ef7b07c33064fa7664756334167164853"}'

jobs:
  native:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/feat/freebsd-foreground-update'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    env:
      PHASE_PROBE_SHA: f22cee147ab5808b3c91ccd9e2f78b061e3b7d79b5c3ee16454b9d1f675c0023
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      MANIFEST_SHA: 5fd298f23534da980e829a4a5b26efcf3d89fc20891890f052f08ee7073a66c1
      ARCHIVE_SHA: 15d4bf384df0d14f99bb52b584c8d1ad5310b17b1c8ed4a506b0d4a697fbd03b
      PACKAGE_VERSION: 2026.9.4
      PAYLOAD_ARTIFACT_ID: "10450734825"
      PAYLOAD_ARTIFACT_DIGEST: sha256:f29b19ebe7d73f519546550053bd4d5ae2007e319f6f7ea0feae0569b4230817
      PROOF_REPOSITORY: openclaw/openclaw
      PROOF_RUN_ID: "35107555993"
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROOF_RUN_ATTEMPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 15
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-foreground-proof.yml
      - name: Verify the workflow-only producer and reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^)" = 3154de4e4620593ac739ba05dfbd48fb3e7d3c86
          test "$(git rev-parse HEAD^^)" = f601a508ea69565135a364896ed67f2c9a7f0cc5
          test "$(git rev-parse HEAD^^^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$PASSED_SOURCE_SHA"
          test "$(git rev-parse "$PASSED_SOURCE_SHA^")" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          git merge-base --is-ancestor "$COMPARISON_BASE" HEAD
          git diff --exit-code "$PRODUCT_SHA" HEAD -- . ':(exclude).github/workflows/freebsd-foreground-proof.yml'
          printf 'consumer_head=%s consumer_run=%s consumer_attempt=%s producer_head=%s producer_run=%s producer_attempt=%s\n' "$HARNESS_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" "$PROOF_RUN_ID" "$PROOF_RUN_ATTEMPT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ env.PAYLOAD_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ env.PROOF_REPOSITORY }}
          run-id: ${{ env.PROOF_RUN_ID }}
          path: proof-input
          merge-multiple: true
      - name: Read authenticated admission source without execution
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(hash('proof-input/payload/install-smoke-candidate-payload.json'),process.env.MANIFEST_SHA);
          assert.equal(hash('proof-input/payload/candidate.tgz'),'7b429bbea2f472c11c0af055eae87eafa4ded66e47f81dade42ec38cd665a86d');
          assert.equal(hash('proof-input/source.tar.gz'),process.env.ARCHIVE_SHA);
          NODE
          cat > proof-input/phase-probe.mjs <<'PROBE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const key = Symbol.for("openclaw.freebsd.admission-phase-proof");
          const proof = process.env.PROOF_ROOT;
          const installed = process.env.INSTALLED_ROOT;
          const diagnostics = `${proof}/diagnostics`;
          const hash = (value) => createHash("sha256").update(value).digest("hex");
          const phases = [
            "entry",
            "ownership-returned",
            "import-resolved",
            "discovery-returned",
            "expiry-before-discovery",
            "expiry-after-discovery",
          ];
          const self = fileURLToPath(import.meta.url);
          let invoked;
          try {
            invoked = process.argv[1] && fs.realpathSync(process.argv[1]);
          } catch {}

          export function instrument(source) {
            const matches = [
              ...source.matchAll(
                /async function assertFreeBsdForegroundUpdateAdmission\(params\) \{[\s\S]*?\n\}/g,
              ),
            ];
            assert.equal(matches.length, 1, "expected exactly one compiled admission function");
            const original = matches[0][0];
            assert(original.length < 4096, "unexpected compiled admission function size");
            assert(!source.includes("__openclawAdmissionProof"), "probe identifier already exists");
            const edits = [];
            let body = original;
            function replaceOne(pattern, make) {
              const hits = [...body.matchAll(new RegExp(pattern.source, "g"))];
              assert.equal(hits.length, 1, `compiled phase shape mismatch: ${pattern.source}`);
              const before = hits[0][0],
                after = make(before);
              assert.notEqual(before, after);
              edits.push([before, after]);
              body = body.replace(before, after);
            }
            replaceOne(
              /const deadline\s*=\s*Date\.now\(\)\s*\+\s*admissionBudget\(params\.timeoutMs\);/,
              (value) =>
                `${value}\nconst __openclawAdmissionProof = globalThis[Symbol.for('openclaw.freebsd.admission-phase-proof')]?.begin();`,
            );
            const mark = (phase) =>
              `globalThis[Symbol.for('openclaw.freebsd.admission-phase-proof')]?.mark(__openclawAdmissionProof, '${phase}');`;
            replaceOne(
              /await assertFreeBsdUpdateRootOwnership\(params\);/,
              (value) => `${value}\n${mark("ownership-returned")}`,
            );
            replaceOne(
              /const remaining\s*=\s*deadline\s*-\s*Date\.now\(\);/,
              (value) => `${mark("import-resolved")}\n${value}`,
            );
            replaceOne(
              /const discovery\s*=\s*await readFreeBsdGatewayServiceDiscovery\(\{\s*timeoutMs:\s*remaining\s*\}\);/,
              (value) => `${value}\n${mark("discovery-returned")}`,
            );
            const expired = [
              ...body.matchAll(
                /new FreeBsdUpdateServiceDiscoveryError\("unknown", "admission deadline expired"\)/g,
              ),
            ];
            assert.equal(expired.length, 2, "expected the two unchanged deadline refusals");
            for (const [index, phase] of ["expiry-before-discovery", "expiry-after-discovery"].entries()) {
              const before = expired[index][0];
              const after = `(globalThis[Symbol.for('openclaw.freebsd.admission-phase-proof')]?.mark(__openclawAdmissionProof, '${phase}'), ${before})`;
              const offset = index === 0 ? body.indexOf(before) : body.lastIndexOf(before);
              edits.push([before, after]);
              body = body.slice(0, offset) + after + body.slice(offset + before.length);
            }
            let inverse = body;
            for (const [before, after] of [...edits].reverse()) {
              assert.equal(inverse.split(after).length, 2, "probe inverse shape mismatch");
              inverse = inverse.replace(after, before);
            }
            assert.equal(inverse, original, "probe inverse must preserve every original byte");
            const output =
              source.slice(0, matches[0].index) + body + source.slice(matches[0].index + original.length);
            assert.equal(output.replace(body, original), source, "full bundle inverse mismatch");
            return { output, originalFunction: hash(original), edits: edits.length };
          }

          function findBundle(root) {
            const found = [];
            function visit(relative = "dist") {
              for (const entry of fs.readdirSync(path.join(root, relative), { withFileTypes: true })) {
                const file = path.join(relative, entry.name);
                if (entry.isDirectory()) visit(file);
                else if (entry.isFile() && file.endsWith(".js")) {
                  const source = fs.readFileSync(path.join(root, file), "utf8");
                  if (source.includes("async function assertFreeBsdForegroundUpdateAdmission("))
                    found.push({ file, source });
                }
              }
            }
            visit();
            assert.equal(found.length, 1, "expected one sealed admission bundle");
            return found[0];
          }

          if (invoked === self && process.argv[2] === "check-source") {
            const source = fs.readFileSync(process.argv[3], "utf8");
            const start = source.indexOf("export async function assertFreeBsdForegroundUpdateAdmission(");
            const end = source.indexOf("\nexport type FreeBsdUpdateRootAdmission", start);
            assert(start >= 0 && end > start);
            const bodyStart = source.indexOf("): Promise<void> {", start) + "): Promise<void> {".length;
            const fixture = `async function assertFreeBsdForegroundUpdateAdmission(params) {${source.slice(bodyStart, end).trimEnd()}`;
            const result = instrument(fixture);
            assert.equal(result.edits, 6);
            assert.throws(() => instrument(fixture + fixture));
            assert.throws(() => instrument(fixture.replace("const remaining", "const unexpected")));
            console.log(
              JSON.stringify({ sourceShapeAndInverse: true, originalFunction: result.originalFunction }),
            );
          } else if (invoked === self && process.argv[2] === "check-package") {
            const { file, source } = findBundle(process.argv[3]);
            const patched = instrument(source);
            const receipt = {
              file,
              original: hash(source),
              instrumented: hash(patched.output),
              functionSha256: patched.originalFunction,
              edits: patched.edits,
            };
            fs.writeFileSync(process.argv[4], JSON.stringify(receipt), { flag: "wx", mode: 0o600 });
            console.log(JSON.stringify({ compiledShapeAndInverse: receipt, qualification: false }));
          } else if (
            invoked === self ||
            (invoked === `${installed}/openclaw.mjs` && process.argv.includes("update"))
          ) {
            assert(proof?.startsWith("/root/openclaw-foreground-proof."));
            assert.equal(installed, `${proof}/installation/lib/node_modules/openclaw`);
            assert.equal(process.env.HOME, `${proof}/operator`);
            assert.equal(process.env.OPENCLAW_STATE_DIR, `${proof}/operator/state-root`);
            assert.equal(process.env.OPENCLAW_CONFIG_PATH, `${proof}/operator/openclaw.json`);
            assert.equal(process.env.OPENCLAW_HOME, undefined);
            const mode = invoked === self ? process.argv[2] : "observe";
            const recordFile = `${diagnostics}/bundle.json`;
            if (mode === "prepare") {
              const { file, source } = findBundle(installed);
              assert.equal(
                hash(source),
                hash(fs.readFileSync(path.join(process.env.PACKAGED_ROOT, file))),
                "installed bundle differs from sealed package",
              );
              const target = path.join(installed, file),
                stat = fs.lstatSync(target);
              assert(stat.isFile());
              assert.equal(stat.uid, 0);
              assert.equal(stat.mode & 0o022, 0);
              const patched = instrument(source);
              const record = {
                file,
                original: hash(source),
                instrumented: hash(patched.output),
                functionSha256: patched.originalFunction,
                edits: patched.edits,
