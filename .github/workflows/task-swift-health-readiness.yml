name: Task Swift health readiness

on:
  push:
    branches: [codex/swift-health-readiness-ci-20260916]

permissions:
  contents: read

concurrency:
  group: task-swift-health-readiness-20260916
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  health-readiness:
    if: github.repository == 'openclaw/openclaw' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind source and select the failed job's toolchain
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/swift-health-readiness"
          mkdir -p "$proof_dir"
          private_tmp="$(getconf DARWIN_USER_TEMP_DIR)"
          test -d "$private_tmp"
          echo "TMPDIR=$private_tmp" >> "$GITHUB_ENV"
          for xcode_app in /Applications/Xcode_26.6.app /Applications/Xcode-26.6.0.app; do
            if [[ -d "$xcode_app/Contents/Developer" ]]; then
              sudo xcode-select -s "$xcode_app/Contents/Developer"
              break
            fi
          done
          {
            git rev-parse HEAD HEAD^{tree}
            git status --short
            sw_vers
            xcodebuild -version
            swift --version
            sysctl hw.logicalcpu hw.memsize
            shasum -a 256 \
              .github/workflows/task-swift-health-readiness.yml \
              scripts/test-macos-native.mts \
              apps/macos/Tests/OpenClawIPCTests/GatewayHealthOwnershipTests.swift \
              apps/macos/Tests/OpenClawIPCTests/GatewayWebSocketTestSupport.swift \
              apps/macos/Sources/OpenClaw/HealthStore.swift \
              apps/macos/Sources/OpenClaw/ControlChannel.swift \
              apps/macos/Sources/OpenClaw/GatewayConnection.swift \
              apps/shared/OpenClawKit/Sources/OpenClawKit/GatewayChannel.swift
          } | tee "$proof_dir/source-and-toolchain.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(xcodebuild -version | tr '\n' ' ' | sed 's/ $//')" = "Xcode 26.6 Build version 17F113"
          swift --version | head -n 1 | grep -F 'Apple Swift version 6.3.3 (swiftlang-6.3.3.1.3 clang-2100.1.1.101)'
          git diff --exit-code

      - name: Setup native test tooling dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          cache-mode: restore
          install-bun: "false"
          install-deps: "true"

      - name: Prepare Apple Mermaid assets
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Build native app tests
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native \
            --enable-code-coverage --build-tests \
            2>&1 | tee "$RUNNER_TEMP/swift-health-readiness/build.log"
          git diff --exit-code

      - name: Run the original serialized health suite once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-macos-native.mts default \
            --package-path apps/macos --build-system native --enable-code-coverage \
            --skip-build --experimental-maximum-parallelization-width 3 \
            --filter GatewayHealthOwnershipTests \
            2>&1 | tee "$RUNNER_TEMP/swift-health-readiness/native-tests.log"

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-health-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/swift-health-readiness
          if-no-files-found: error
          retention-days: 7
