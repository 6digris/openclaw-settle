name: Blacksmith Build Artifacts Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
      run_chromium_cache_benchmark:
        type: boolean
        description: "Run only the isolated Chromium cache comparison"
        default: false
      benchmark_sha:
        type: string
        description: "Exact workflow SHA required by the Chromium benchmark"
        default: ""
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  # Admission precedes job skips: isolate passive drafts before they can cancel useful work.
  # Keep conversion events in the PR group where subscribed, as an intentional cancellation signal.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft'
      && format('{0}-passive-draft-{1}', github.workflow, github.run_id)
      || (github.event_name == 'pull_request' && format('{0}-pr-v1-{1}', github.workflow, github.event.pull_request.number) || format('{0}-manual-v1-{1}', github.workflow, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-artifacts:
    if: ${{ !inputs.run_chromium_cache_benchmark && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    permissions:
      contents: read
    name: "build-artifacts"
    # Pull requests only validate the artifact build; real Testbox leases
    # arrive via dispatch. Hosted PR runs keep this landing gate satisfiable
    # during Blacksmith outages (mirrors ci-check-testbox.yml).
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 35
    steps:
      # Testbox lifecycle actions require Blacksmith VM metadata; PRs validate the build only.
      - name: Begin Testbox
        if: github.event_name == 'workflow_dispatch'
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '0' }}
          persist-credentials: false

      - name: Setup Node environment
        id: setup-node-env
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: ${{ github.event_name == 'workflow_dispatch' && 'read-write' || 'restore' }}
          install-bun: "false"

      - name: Resolve release dist cache seeds
        id: dist-cache-seeds
        shell: bash
        run: |
          set -euo pipefail

          cache_prefix="${RUNNER_OS}-dist-build-v2-"
          declare -A seen=()

          resolve_tag_sha() {
            local tag="$1"
            local direct=""
            local peeled=""

            while read -r sha ref; do
              if [[ "$ref" == "refs/tags/${tag}^{}" ]]; then
                peeled="$sha"
              elif [[ "$ref" == "refs/tags/${tag}" ]]; then
                direct="$sha"
              fi
            done < <(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")

            printf '%s\n' "${peeled:-$direct}"
          }

          {
            echo "restore-keys<<EOF"
            for dist_tag in beta latest; do
              version="$(npm view "openclaw@${dist_tag}" version 2>/dev/null || true)"
              if [[ -z "$version" ]]; then
                echo "Could not resolve npm dist-tag ${dist_tag}; skipping cache seed." >&2
                continue
              fi

              sha="$(resolve_tag_sha "v${version}")"
              if [[ -z "$sha" ]]; then
                echo "Could not resolve git tag v${version}; skipping cache seed." >&2
                continue
              fi

              key="${cache_prefix}${sha}"
              if [[ -z "${seen[$key]+x}" ]]; then
                echo "$key"
                seen[$key]=1
              fi
            done
            echo "${cache_prefix}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dist build cache
        id: dist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/build-all-cache/
            dist/
            dist-runtime/
            packages/*/dist/
          key: ${{ runner.os }}-dist-build-v2-${{ github.sha }}
          restore-keys: ${{ steps.dist-cache-seeds.outputs.restore-keys }}

      - name: Build dist on cache miss
        if: steps.dist-cache.outputs.cache-hit != 'true'
        env:
          # Hosted PR runners have 16GB total; the 16GB heap fits only the
          # dispatch-time 16vcpu Blacksmith box.
          NODE_OPTIONS: ${{ github.event_name == 'pull_request' && '--max-old-space-size=8192' || '--max-old-space-size=16384' }}
        run: pnpm build:ci-artifacts

      - name: Build Control UI on cache miss
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm ui:build

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test -d dist-runtime
          test -f packages/ai/dist/internal/runtime.mjs
          if [[ ! -f dist/index.js && ! -f dist/index.mjs ]]; then
            echo "Missing dist/index.js or dist/index.mjs" >&2
            exit 1
          fi
          test -f dist/build-info.json
          test -f dist/control-ui/index.html

      - name: Save dist build cache
        if: steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/build-all-cache/
            dist/
            dist-runtime/
            packages/*/dist/
          key: ${{ runner.os }}-dist-build-v2-${{ github.sha }}

      - name: Prepare Testbox shell
        uses: ./.github/actions/prepare-testbox-shell
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'refs/remotes/origin/main' }}

      - name: Hydrate Testbox provider env helper
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_OLD: ${{ secrets.ANTHROPIC_API_KEY_OLD }}
          ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
          BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MODELSTUDIO_API_KEY: ${{ secrets.MODELSTUDIO_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENCLAW_LIVE_BROWSER_CDP_URL: ${{ secrets.OPENCLAW_LIVE_BROWSER_CDP_URL }}
          OPENCLAW_LIVE_SETUP_TOKEN: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN }}
          OPENCLAW_LIVE_SETUP_TOKEN_MODEL: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_MODEL }}
          OPENCLAW_LIVE_SETUP_TOKEN_PROFILE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_PROFILE }}
          OPENCLAW_LIVE_SETUP_TOKEN_VALUE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_VALUE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          VYDRA_API_KEY: ${{ secrets.VYDRA_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          BYTEPLUS_ACCESS_KEY_ID: ${{ secrets.BYTEPLUS_ACCESS_KEY_ID }}
          BYTEPLUS_SECRET_ACCESS_KEY: ${{ secrets.BYTEPLUS_SECRET_ACCESS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCLAW_CODEX_AUTH_JSON: ${{ secrets.OPENCLAW_CODEX_AUTH_JSON }}
          OPENCLAW_CODEX_CONFIG_TOML: ${{ secrets.OPENCLAW_CODEX_CONFIG_TOML }}
          OPENCLAW_CLAUDE_JSON: ${{ secrets.OPENCLAW_CLAUDE_JSON }}
          OPENCLAW_CLAUDE_CREDENTIALS_JSON: ${{ secrets.OPENCLAW_CLAUDE_CREDENTIALS_JSON }}
          OPENCLAW_CLAUDE_SETTINGS_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_JSON }}
          OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON }}
          OPENCLAW_GEMINI_SETTINGS_JSON: ${{ secrets.OPENCLAW_GEMINI_SETTINGS_JSON }}
        run: bash scripts/ci-hydrate-testbox-env.sh

      - name: Run Testbox
        # Temporary local-listener fix: https://github.com/useblacksmith/run-testbox/pull/15
        # Return to useblacksmith/run-testbox after the fix lands upstream.
        uses: steipete/run-testbox@2b6b1be536ec7f3c73757fedf5460a27ab4856b4
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  chromium-cache-seed:
    name: Chromium cache benchmark producer
    if: ${{ inputs.run_chromium_cache_benchmark && github.repository == 'openclaw/openclaw' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      cache_key: ${{ steps.identity.outputs.cache_key }}
    env:
      BENCH_ARM: seed
      BENCH_SAMPLE: "0"
      BENCH_SOURCE: ${{ inputs.benchmark_sha }}
      BENCH_CACHE_KEY: chromium-benchmark-v1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - &chromium_benchmark_checkout
        name: Checkout benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &chromium_benchmark_identity
        name: Bind benchmark source and start setup timer
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$BENCH_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$BENCH_SOURCE"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          echo "BENCH_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "cache_key=$BENCH_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - &chromium_benchmark_node
        name: Setup Node without shared cache namespaces
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
          node-version: "24.19.0"
          install-bun: "false"

      - &chromium_benchmark_initialize
        name: Qualify allocation and initialize empty browser directory
        shell: bash
        run: node scripts/chromium-cache-benchmark.mjs initialize

      - &chromium_benchmark_install
        name: Measure unchanged pinned-browser installer
        shell: bash
        run: |
          set -euo pipefail
          install_start="$(node -p 'Date.now()')"
          set +e
          node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium \
            2>&1 | tee .artifacts/chromium-cache-benchmark/install.log
          install_exit="$?"
          set -e
          install_end="$(node -p 'Date.now()')"
          node scripts/chromium-cache-benchmark.mjs installed "$install_start" "$install_end" "$install_exit"

      - &chromium_benchmark_verify
        name: Verify pinned browser and isolated page smoke
        shell: bash
        run: node scripts/chromium-cache-benchmark.mjs verify

      - name: Start archive timer
        shell: bash
        run: echo "BENCH_SAVE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Save isolated Chromium archive
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/chromium-cache-benchmark
          key: ${{ env.BENCH_CACHE_KEY }}

      - name: Record archive publication cost
        shell: bash
        run: node scripts/chromium-cache-benchmark.mjs saved

      - &chromium_benchmark_receipt
        name: Upload small benchmark receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chromium-benchmark-${{ env.BENCH_ARM }}-${{ env.BENCH_SAMPLE }}
          path: |
            .artifacts/chromium-cache-benchmark/receipt.json
            .artifacts/chromium-cache-benchmark/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  chromium-cache-consumers:
    name: Chromium cache benchmark (${{ matrix.arm }} ${{ matrix.sample }})
    if: ${{ inputs.run_chromium_cache_benchmark }}
    needs: [chromium-cache-seed]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { arm: cold, sample: 1 }
          - { arm: warm, sample: 1 }
          - { arm: warm, sample: 2 }
          - { arm: cold, sample: 2 }
          - { arm: cold, sample: 3 }
          - { arm: warm, sample: 3 }
    env:
      BENCH_ARM: ${{ matrix.arm }}
      BENCH_SAMPLE: ${{ matrix.sample }}
      BENCH_SOURCE: ${{ inputs.benchmark_sha }}
      BENCH_CACHE_KEY: ${{ needs.chromium-cache-seed.outputs.cache_key }}
    steps:
      - *chromium_benchmark_checkout
      - *chromium_benchmark_identity
      - *chromium_benchmark_node
      - *chromium_benchmark_initialize
      - name: Restore isolated Chromium archive
        id: browser_cache
        if: matrix.arm == 'warm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/chromium-cache-benchmark
          key: ${{ env.BENCH_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Prove restored pinned executable and record restore cost
        if: matrix.arm == 'warm'
        shell: bash
        env:
          BENCH_CACHE_HIT: ${{ steps.browser_cache.outputs.cache-hit }}
          BENCH_MATCHED_KEY: ${{ steps.browser_cache.outputs.cache-matched-key }}
        run: node scripts/chromium-cache-benchmark.mjs restored

      - *chromium_benchmark_install
      - *chromium_benchmark_verify
      - *chromium_benchmark_receipt

  chromium-cache-summary:
    name: Chromium cache benchmark comparison
    if: ${{ inputs.run_chromium_cache_benchmark }}
    needs: [chromium-cache-seed, chromium-cache-consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *chromium_benchmark_checkout
      - name: Download benchmark receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: chromium-benchmark-*
          path: .artifacts/chromium-benchmark-cohort

      - name: Verify allocation criteria and summarize the complete comparison
        shell: bash
        run: |
          set -euo pipefail
          node scripts/chromium-cache-benchmark.mjs summarize \
            .artifacts/chromium-benchmark-cohort/*/receipt.json \
            > .artifacts/chromium-benchmark-cohort/comparison.md
          cat .artifacts/chromium-benchmark-cohort/comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat .artifacts/chromium-benchmark-cohort/comparison.md

      - name: Upload compact comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chromium-benchmark-comparison
          path: .artifacts/chromium-benchmark-cohort/comparison.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
