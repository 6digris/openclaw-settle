name: Vitest Cache Fingerprint Probe (temporary branch)

# Replace this already registered workflow only on the reviewed probe branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-cache-fingerprint-probe
  cancel-in-progress: false

jobs:
  fingerprint:
    if: github.repository == 'openclaw/openclaw'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed probe tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .probe-tooling
          sparse-checkout: scripts/ci-vitest-cache-fingerprint-probe.py
          sparse-checkout-cone-mode: false

      - name: Retain and bind probe tooling outside the source checkout
        working-directory: .probe-tooling
        env:
          PROBE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/transform-fingerprint-probe"
          cp scripts/ci-vitest-cache-fingerprint-probe.py "$RUNNER_TEMP/transform-fingerprint-probe/helper.py"
          python3 "$RUNNER_TEMP/transform-fingerprint-probe/helper.py" tooling

      - name: Checkout reviewed main source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 13198711efbe769c7ff090067a2be6d4a954340a
          persist-credentials: false
          sparse-checkout: ""
          clean: true

      - name: Prepare isolated observations in the normal sparse harness
        run: python3 "$RUNNER_TEMP/transform-fingerprint-probe/helper.py" prepare

      - name: Normal restore-only Node setup with boundary observations
        id: setup
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: restore
          dependency-cache: "true"
          install-bun: "false"
          vitest-fs-cache: "true"
          node-compile-cache: "true"
          node-compile-cache-scope: test

      - name: Record parity or explicit inconclusive outcome
        if: ${{ always() && steps.setup.outcome != '' }}
        env:
          PROBE_SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: python3 "$RUNNER_TEMP/transform-fingerprint-probe/helper.py" finish

      - name: Upload diagnostic receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transform-fingerprint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transform-fingerprint-probe
          if-no-files-found: error
          retention-days: 7
