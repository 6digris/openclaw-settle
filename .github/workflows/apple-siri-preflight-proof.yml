name: Apple Siri preflight proof

on:
  push:
    branches: [test/apple-siri-system-proof]

permissions:
  contents: read

concurrency:
  group: apple-siri-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'openclaw/openclaw'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Probe disposable native Shortcuts runtimes
        run: node scripts/test-apple-shortcuts-preflight.mjs "$RUNNER_TEMP/apple-siri-preflight.json"
      - name: Upload allowlisted feasibility receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-siri-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/apple-siri-preflight.json
          if-no-files-found: error
          retention-days: 7
