name: Windows Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
      runner_label:
        type: string
        description: "Windows runner label"
        required: false
        default: "blacksmith-16vcpu-windows-2025"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    name: windows
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Begin Testbox
        id: begin_testbox
        shell: bash
        env:
          TESTBOX_ID: ${{ inputs.testbox_id }}
        run: |
          set -euo pipefail

          metadata_port="${METADATA_PORT:-}"
          if [ -z "$metadata_port" ]; then
            metadata_port="$(cat /proc/cmdline | tr ' ' '\n' | grep '^metadata_port=' | cut -d= -f2)"
          fi
          if [ -z "$metadata_port" ]; then
            echo "metadata_port not found in kernel cmdline" >&2
            exit 1
          fi

          metadata_addr="192.168.127.1:${metadata_port}"
          state=/tmp/.testbox
          mkdir -p "$state"
          chmod 700 "$state"

          installation_model_id="$(curl -s --connect-timeout 2 --max-time 5 "http://${metadata_addr}/installationModelID")"
          api_url="$(curl -s --connect-timeout 2 --max-time 5 "http://${metadata_addr}/backendURL")"
          auth_token="$(curl -s --connect-timeout 2 --max-time 5 "http://${metadata_addr}/stickyDiskToken")"

          if [ -z "$api_url" ] || [ -z "$installation_model_id" ] || [ -z "$auth_token" ]; then
            echo "could not read required Blacksmith metadata" >&2
            exit 1
          fi
          if ! jq -e 'type == "number"' <<<"$installation_model_id" >/dev/null; then
            echo "invalid Blacksmith installation model id: ${installation_model_id}" >&2
            exit 1
          fi

          if [ -n "${BLACKSMITH_HOSTNAME:-}" ]; then
            runner_host="$BLACKSMITH_HOSTNAME"
          else
            runner_host="${BLACKSMITH_HOST_PUBLIC_IP:-}"
          fi
          runner_ssh_port="${BLACKSMITH_SSH_PORT:-22}"

          echo "$TESTBOX_ID" > "$state/testbox_id"
          echo "$installation_model_id" > "$state/installation_model_id"
          echo "$auth_token" > "$state/auth_token"
          echo "$api_url" > "$state/api_url"
          echo "$runner_host" > "$state/runner_host"
          echo "$runner_ssh_port" > "$state/runner_ssh_port"
          echo "$GITHUB_WORKSPACE" > "$state/working_directory"
          echo "$GITHUB_RUN_ID" > "$state/adopted_run_id"

          hydrating_body="$RUNNER_TEMP/testbox-hydrating.json"
          hydrating_response="$RUNNER_TEMP/testbox-hydrating.response"
          jq -n \
            --arg testbox_id "$TESTBOX_ID" \
            --argjson installation_model_id "$installation_model_id" \
            --arg status "hydrating" \
            --arg ip_address "$runner_host" \
            --arg ssh_port "$runner_ssh_port" \
            --arg working_directory "$GITHUB_WORKSPACE" \
            --arg adopted_run_id "$GITHUB_RUN_ID" \
            '{
              testbox_id: $testbox_id,
              installation_model_id: $installation_model_id,
              status: $status,
              ip_address: $ip_address,
              ssh_port: $ssh_port,
              working_directory: $working_directory,
              adopted_run_id: $adopted_run_id,
              metadata: {}
            }' > "$hydrating_body"

          # curl can expose a 2xx status before a response-body timeout, so preserve its exit code.
          hydrating_curl_status=0
          hydrating_http_code="$(curl -sS -L --post302 --post303 \
            --connect-timeout 10 --max-time 30 \
            -o "$hydrating_response" -w '%{http_code}' \
            -X POST "${api_url}/api/testbox/phone-home" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${auth_token}" \
            --data-binary @"$hydrating_body")" || hydrating_curl_status=$?

          echo "phone_home_hydrating_curl=${hydrating_curl_status}"
          echo "phone_home_hydrating_http=${hydrating_http_code}"
          if (( hydrating_curl_status != 0 )) || [[ ! "$hydrating_http_code" =~ ^2 ]]; then
            echo "Blacksmith phone-home hydrating failed." >&2
            exit 1
          fi
          response="$(cat "$hydrating_response")"

          if [ -n "$response" ] && echo "$response" | jq -e . >/dev/null 2>&1; then
            echo "$response" | jq -r '.ssh_public_key // empty' > "$state/ssh_public_key"
            idle_timeout="$(echo "$response" | jq -r '.idle_timeout // empty')"
            echo "${idle_timeout:-10}" > "$state/idle_timeout"
            echo "phone-home response=json"
          else
            printf '%s\n' "$response" > "$state/ssh_public_key"
            echo "10" > "$state/idle_timeout"
            echo "phone-home response=raw"
          fi

          ssh_public_key="$(cat "$state/ssh_public_key" 2>/dev/null || true)"
          if [ -z "$ssh_public_key" ]; then
            echo "Blacksmith phone-home did not return an SSH public key; testbox cannot accept native SSH connections." >&2
            exit 1
          fi
          public_key_path="$(cygpath -aw "$state/ssh_public_key")"
          printf 'public_key_path=%s\n' "$public_key_path" >> "$GITHUB_OUTPUT"
          printf 'bash_os=%s\nbash_user=%s\n' "$(uname -s)" "$(id -un)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare Windows SSH
        id: prepare_windows
        env:
          TESTBOX_PUBLIC_KEY_PATH: ${{ steps.begin_testbox.outputs.public_key_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Native Windows SSH preparation requires an elevated administrator."
          }
          $nativeUser = [Environment]::UserName
          Write-Host "windows_user=$nativeUser"
          Write-Host ("os=" + [Environment]::OSVersion.VersionString)
          Write-Host ("architecture=" + [Runtime.InteropServices.RuntimeInformation]::OSArchitecture)
          Write-Host ("powershell=" + $PSVersionTable.PSVersion.ToString())

          # Only the stock native OpenSSH service and administrator key-file contract are supported.
          $sshd = "$env:WINDIR\System32\OpenSSH\sshd.exe"
          $keygen = "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe"
          $service = Get-CimInstance Win32_Service -Filter "Name='sshd'"
          # Diagnostic-only receipt: fixed classifications, never raw identity or command data.
          $receipt = [ordered]@{
            service_present = [bool]$service
            service_state = "unavailable"
            configured_LocalSystem_match = [bool]($service -and $service.StartName -eq "LocalSystem")
            running_process_owner_sid_class = "unavailable"
            service_executable_class = "unparseable"
            service_arguments_present = "unknown"
            process_executable_class = "unavailable"
            original_path_guard_match = $false
            process_directory_class = "unavailable"
            process_leaf_is_sshd = "unavailable"
            configured_command_relation = "unavailable"
            service_process_snapshot = "unavailable"
            path_reparse_class = "unavailable"
            signature_status = "unavailable"
            signer_name_class = "unavailable"
            file_version = "unavailable"
            file_acl = [ordered]@{ owner_class = "unavailable"; write_allow_class = "unavailable" }
            installation_directory_acl = [ordered]@{ owner_class = "unavailable"; write_allow_class = "unavailable" }
          }
          $receiptKnownPaths = @(
            @{ path = $sshd; kind = "inbox" }
            @{ path = "$env:ProgramFiles\OpenSSH\sshd.exe"; kind = "program-files" }
          )
          $receiptProcess = $null
          if ($service) {
            if (@("Stopped", "Start Pending", "Stop Pending", "Running", "Continue Pending", "Pause Pending", "Paused", "Unknown") -ccontains $service.State) {
              $receipt.service_state = $service.State
            }
            $receiptCommand = ([string]$service.PathName).Trim()
            $receipt.original_path_guard_match = $receiptCommand.Trim('"') -ieq $sshd
            foreach ($receiptKnown in $receiptKnownPaths) {
              $receiptEscaped = [regex]::Escape($receiptKnown.path)
              if ($receiptCommand -match ('^(?:"' + $receiptEscaped + '"|' + $receiptEscaped + ')(?:\s+(?<arguments>.*))?$')) {
                $receipt.service_executable_class = $receiptKnown.kind
                $receipt.service_arguments_present = -not [string]::IsNullOrWhiteSpace($Matches.arguments)
                break
              }
            }
            if ($service.ProcessId -gt 0) {
              try {
                $receiptProcess = Get-CimInstance Win32_Process -Filter ("ProcessId = " + [uint32]$service.ProcessId) -ErrorAction Stop
                if ($receiptProcess) {
                  if (-not [string]::IsNullOrWhiteSpace($receiptProcess.ExecutablePath)) {
                    $receipt.process_executable_class = "other"
                    foreach ($receiptKnown in $receiptKnownPaths) {
                      if ($receiptProcess.ExecutablePath -ieq $receiptKnown.path) {
                        $receipt.process_executable_class = $receiptKnown.kind
                        break
                      }
                    }
                  }
                  $receiptOwner = Invoke-CimMethod -InputObject $receiptProcess -MethodName GetOwnerSid -ErrorAction Stop
                  if ($receiptOwner.ReturnValue -eq 0 -and -not [string]::IsNullOrWhiteSpace($receiptOwner.Sid)) {
                    $receipt.running_process_owner_sid_class = if ($receiptOwner.Sid -eq "S-1-5-18") { "LocalSystem" } else { "other" }
                  }
                }
              } catch {
                # An unavailable diagnostic read must not print its exception or change admission.
              }
            }
          }
          # Observe only recognized local installations; these classifications never authorize SSH.
          $receiptSidClasses = @{
            "S-1-5-18" = "system"
            "S-1-5-32-544" = "administrators"
            "S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464" = "trusted-installer"
          }
          $receiptReadAcl = {
            param([string]$receiptAclPath)
            $result = [ordered]@{ owner_class = "unavailable"; write_allow_class = "unavailable" }
            try {
              $security = Get-Acl -LiteralPath $receiptAclPath -ErrorAction Stop
              $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new($security.GetSecurityDescriptorBinaryForm(), 0)
              if ($descriptor.Owner) {
                $result.owner_class = if ($receiptSidClasses.ContainsKey($descriptor.Owner.Value)) { $receiptSidClasses[$descriptor.Owner.Value] } else { "other" }
              }
              if ($null -eq $descriptor.DiscretionaryAcl) {
                $result.write_allow_class = "null-dacl"
              } else {
                foreach ($ace in $descriptor.DiscretionaryAcl) {
                  if ($ace -isnot [Security.AccessControl.CommonAce] -or $ace.IsCallback -or
                      $ace.AceType -notin @([Security.AccessControl.AceType]::AccessAllowed, [Security.AccessControl.AceType]::AccessDenied) -or
                      ([long]$ace.AccessMask -band 4026531840L) -ne 0) {
                    throw "Unsupported ACL observation."
                  }
                }
                $writeMask = [Security.AccessControl.FileSystemRights]::Write -bor
                  [Security.AccessControl.FileSystemRights]::Delete -bor
                  [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
                  [Security.AccessControl.FileSystemRights]::ChangePermissions -bor
                  [Security.AccessControl.FileSystemRights]::TakeOwnership
                $result.write_allow_class = "no-other-write-allow"
                foreach ($rule in $security.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
                  if ($rule.AccessControlType -eq [Security.AccessControl.AccessControlType]::Allow -and
                      ($rule.PropagationFlags -band [Security.AccessControl.PropagationFlags]::InheritOnly) -eq 0 -and
                      ($rule.FileSystemRights -band $writeMask) -ne 0 -and
                      -not $receiptSidClasses.ContainsKey($rule.IdentityReference.Value)) {
                    $result.write_allow_class = "other-write-allow"
                  }
                }
              }
            } catch {
              $result.write_allow_class = "unavailable"
            }
            return $result
          }
          if ($receiptProcess -and -not [string]::IsNullOrWhiteSpace($receiptProcess.ExecutablePath)) {
            try {
              $receiptProcessPath = [string]$receiptProcess.ExecutablePath
              $receiptDirectory = [IO.Path]::GetDirectoryName($receiptProcessPath)
              $receipt.process_leaf_is_sshd = [IO.Path]::GetFileName($receiptProcessPath) -ieq "sshd.exe"
              $receipt.process_directory_class = "other"
              $receiptDirectories = @(
                @{ path = "$env:WINDIR\System32\OpenSSH"; kind = "inbox" }
                @{ path = "$env:ProgramFiles\OpenSSH"; kind = "program-files-openssh" }
                @{ path = "$env:ProgramFiles\OpenSSH-Win64"; kind = "program-files-openssh-win64" }
              )
              foreach ($receiptKnownDirectory in $receiptDirectories) {
                if ($receiptDirectory -ieq $receiptKnownDirectory.path) {
                  $receipt.process_directory_class = $receiptKnownDirectory.kind
                  break
                }
              }
              if (-not [string]::IsNullOrWhiteSpace($receiptCommand)) {
                $receipt.configured_command_relation = "different-or-unparseable"
                $receiptEscapedProcess = [regex]::Escape($receiptProcessPath)
                if ($receiptCommand -ieq ('"' + $receiptProcessPath + '"')) {
                  $receipt.configured_command_relation = "quoted-direct"
                } elseif ($receiptCommand -ieq $receiptProcessPath) {
                  $receipt.configured_command_relation = "unquoted-direct"
                } elseif ($receiptCommand -match ('^(?:"' + $receiptEscapedProcess + '"|' + $receiptEscapedProcess + ')\s+\S.*$')) {
                  $receipt.configured_command_relation = "same-path-with-arguments"
                }
              }
              if ($receipt.process_directory_class -ne "other" -and $receipt.process_leaf_is_sshd -eq $true -and
                  $receiptProcessPath -match '^[A-Za-z]:\\') {
                $receiptRoot = [IO.Path]::GetPathRoot($receiptProcessPath)
                $receiptParts = $receiptProcessPath.Substring($receiptRoot.Length).Split('\')
                if ($receiptParts.Count -le 6) {
                  # Check from the drive root downward, stopping before following any reparse point.
                  $receiptComponents = @($receiptRoot)
                  $receiptComponent = $receiptRoot
                  foreach ($receiptPart in $receiptParts) {
                    $receiptComponent = Join-Path $receiptComponent $receiptPart
                    $receiptComponents += $receiptComponent
                  }
                  foreach ($receiptComponent in $receiptComponents) {
                    $receiptItem = Get-Item -LiteralPath $receiptComponent -Force -ErrorAction Stop
                    if (($receiptItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                      $receipt.path_reparse_class = "present"
                      break
                    }
                  }
                  if ($receipt.path_reparse_class -ne "present" -and -not $receiptItem.PSIsContainer) {
                    $receipt.path_reparse_class = "none"
                  }
                }
                if ($receipt.path_reparse_class -eq "none") {
                  $receipt.file_acl = & $receiptReadAcl $receiptProcessPath
                  $receipt.installation_directory_acl = & $receiptReadAcl $receiptDirectory
                  try {
                    $receiptSignature = Get-AuthenticodeSignature -LiteralPath $receiptProcessPath -ErrorAction Stop
                    $receiptSignatureStatus = [string]$receiptSignature.Status
                    if (@("Valid", "UnknownError", "NotSigned", "HashMismatch", "NotTrusted", "NotSupportedFileFormat", "Incompatible") -ccontains $receiptSignatureStatus) {
                      $receipt.signature_status = $receiptSignatureStatus
                    }
                    if ($receiptSignature.SignerCertificate) {
                      $receiptSigner = $receiptSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
                      if (-not [string]::IsNullOrWhiteSpace($receiptSigner)) {
                        $receipt.signer_name_class = if ($receiptSigner -ceq "Microsoft Corporation") { "microsoft-corporation" } elseif ($receiptSigner -ceq "Microsoft Windows") { "microsoft-windows" } else { "other" }
                      }
                    }
                  } catch {
                    # Signature failures are observations, never raw diagnostics or trust decisions.
                  }
                  try {
                    $receiptVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($receiptProcessPath)
                    if (-not [string]::IsNullOrWhiteSpace($receiptVersion.FileVersion)) {
                      $receipt.file_version = @($receiptVersion.FileMajorPart, $receiptVersion.FileMinorPart, $receiptVersion.FileBuildPart, $receiptVersion.FilePrivatePart) -join '.'
                    }
                  } catch {
                    # Never emit arbitrary version-resource strings.
                  }
                }
              }
            } catch {
              # Keep unknown path or metadata reads unavailable without exposing their values.
            }
          }
          if ($service -and $receiptProcess -and $receiptProcess.CreationDate -and
              -not [string]::IsNullOrWhiteSpace($receiptProcess.ExecutablePath)) {
            try {
              $receiptServiceAfter = Get-CimInstance Win32_Service -Filter "Name='sshd'" -ErrorAction Stop
              $receiptProcessAfter = Get-CimInstance Win32_Process -Filter ("ProcessId = " + [uint32]$service.ProcessId) -ErrorAction Stop
              if (-not $receiptServiceAfter -or -not $receiptProcessAfter) {
                $receipt.service_process_snapshot = "changed"
              } elseif ($receiptProcessAfter.CreationDate -and -not [string]::IsNullOrWhiteSpace($receiptProcessAfter.ExecutablePath)) {
                $receipt.service_process_snapshot = if (
                  $receiptServiceAfter.ProcessId -eq $service.ProcessId -and
                  $receiptServiceAfter.State -ceq $service.State -and
                  $receiptServiceAfter.StartName -ceq $service.StartName -and
                  $receiptServiceAfter.PathName -ceq $service.PathName -and
                  $receiptProcessAfter.CreationDate -eq $receiptProcess.CreationDate -and
                  $receiptProcessAfter.ExecutablePath -ceq $receiptProcess.ExecutablePath
                ) { "stable" } else { "changed" }
              }
            } catch {
              # A failed second snapshot cannot establish a stable service/process pair.
            }
          }
          Write-Host ("WINDOWS_SSH_SERVICE_RECEIPT=" + ($receipt | ConvertTo-Json -Compress))
          if (-not $service -or $service.State -ne "Running" -or $service.StartName -ne "LocalSystem" -or
              $service.PathName.Trim().Trim('"') -ine $sshd) {
            throw "Expected the running stock LocalSystem Windows OpenSSH service without arguments."
          }
          throw 'WINDOWS_SSH_RECEIPT_ONLY: admission matched; authentication setup not run.'
          $effectiveConfig = & $sshd -T -C "user=$nativeUser" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect native Windows OpenSSH configuration." }
          $keySetting = @($effectiveConfig | Where-Object { $_ -match '^authorizedkeysfile\s' })
          if ($keySetting.Count -ne 1 -or $keySetting[0] -cne 'authorizedkeysfile __PROGRAMDATA__/ssh/administrators_authorized_keys') {
            throw "Expected the stock administrator AuthorizedKeysFile for the native Windows user."
          }
          $authorizedKeys = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          if (-not (Test-Path -LiteralPath $authorizedKeys -PathType Leaf)) {
            throw "Expected the provider's existing administrator authorized keys file."
          }

          $keyInfo = @(& $keygen -E sha256 -lf $env:TESTBOX_PUBLIC_KEY_PATH 2>&1)
          if ($LASTEXITCODE -ne 0 -or $keyInfo.Count -ne 1 -or
              $keyInfo[0] -notmatch '^\d+\s+(SHA256:[A-Za-z0-9+/]+)\s') {
            throw "Testbox did not provide one valid SSH public key."
          }
          $fingerprint = $Matches[1]
          $publicKey = [IO.File]::ReadAllText($env:TESTBOX_PUBLIC_KEY_PATH).Trim()
          if ($publicKey -match '[\r\n]') { throw "Expected a single-line Testbox SSH public key." }

          # Windows OpenSSH requires only SYSTEM and Administrators; SIDs avoid localized names.
          $acl = [Security.AccessControl.FileSecurity]::new()
          $acl.SetOwner([Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @('S-1-5-18', 'S-1-5-32-544')) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
              [Security.Principal.SecurityIdentifier]::new($sid), "FullControl", "Allow"))
          }
          Set-Acl -LiteralPath $authorizedKeys -AclObject $acl
          # Preserve provider keys byte-for-byte, including a final line without a newline.
          [IO.File]::AppendAllText($authorizedKeys, "`r`n$publicKey`r`n", [Text.UTF8Encoding]::new($false))
          Write-Host "authorized_keys=$authorizedKeys testbox_key_fingerprint=$fingerprint"
          "ssh_user=$nativeUser" >> $env:GITHUB_OUTPUT

      - name: Run Testbox
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          NATIVE_SSH_USER: ${{ steps.prepare_windows.outputs.ssh_user }}
        run: |
          set -euo pipefail

          state=/tmp/.testbox
          test -d "$state"

          testbox_id="$(cat "$state/testbox_id")"
          installation_model_id="$(cat "$state/installation_model_id")"
          auth_token="$(cat "$state/auth_token")"
          idle_timeout="$(cat "$state/idle_timeout" 2>/dev/null || true)"
          idle_timeout="${idle_timeout:-10}"
          api_url="$(cat "$state/api_url")"
          runner_host="$(cat "$state/runner_host")"
          runner_ssh_port="$(cat "$state/runner_ssh_port")"
          working_directory="$(cat "$state/working_directory")"
          adopted_run_id="$(cat "$state/adopted_run_id")"
          if ! jq -e 'type == "number"' <<<"$installation_model_id" >/dev/null; then
            echo "invalid Blacksmith installation model id: ${installation_model_id}" >&2
            exit 1
          fi

          phone_home_status="ready"
          if [ "$JOB_STATUS" != "success" ]; then
            phone_home_status="hydration_failed"
          fi
          final_body="$RUNNER_TEMP/testbox-final.json"
          jq -n \
            --arg testbox_id "$testbox_id" \
            --argjson installation_model_id "$installation_model_id" \
            --arg status "$phone_home_status" \
            --arg ip_address "$runner_host" \
            --arg ssh_port "$runner_ssh_port" \
            --arg working_directory "$working_directory" \
            --arg adopted_run_id "$adopted_run_id" \
            '{
              testbox_id: $testbox_id,
              installation_model_id: $installation_model_id,
              status: $status,
              ip_address: $ip_address,
              ssh_port: $ssh_port,
              working_directory: $working_directory,
              adopted_run_id: $adopted_run_id,
              metadata: {}
            }' > "$final_body"

          # curl can expose a 2xx status before a response-body timeout, so preserve its exit code.
          final_curl_status=0
          http_code="$(curl -sS -L --post302 --post303 \
            --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/testbox-final.response" -w '%{http_code}' \
            -X POST "${api_url}/api/testbox/phone-home" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${auth_token}" \
            --data-binary @"$final_body")" || final_curl_status=$?
          echo "phone_home_${phone_home_status}_curl=${final_curl_status}"
          echo "phone_home_${phone_home_status}_http=${http_code}"
          if (( final_curl_status != 0 )) || [[ ! "$http_code" =~ ^2 ]]; then
            echo "Blacksmith phone-home ${phone_home_status} failed." >&2
            exit 1
          fi

          if [ "$phone_home_status" != "ready" ]; then
            echo "Testbox setup failed; reported hydration_failed." >&2
            exit 1
          fi

          echo "============================================"
          echo "Testbox ready!"
          echo "  Testbox ID:         ${testbox_id}"
          echo "  Runner host:        ${runner_host}"
          echo "  SSH port:           ${runner_ssh_port}"
          echo "  Working directory:  ${working_directory}"
          echo "  Run ID:             ${adopted_run_id}"
          echo "  SSH:                ssh -p ${runner_ssh_port} ${NATIVE_SSH_USER}@${runner_host}"
          echo "============================================"

          echo "Native SSH inspection only: Blacksmith CLI 0.4.57 still targets runner and has no username override; supported sync/run remains blocked."

          # Blacksmith advertises a forwarded port; native sockets use sshd's local listeners.
          runner_ssh_local_ports="$(pwsh -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            $service = Get-CimInstance Win32_Service -Filter "Name = `"sshd`""
            if ($service.State -ne "Running" -or $service.ProcessId -eq 0) {
              throw "Cannot monitor activity without the running Windows SSH service."
            }
            $ports = @(Get-NetTCPConnection -State Listen -OwningProcess $service.ProcessId |
              Select-Object -ExpandProperty LocalPort -Unique)
            if ($ports.Count -eq 0) { throw "No local Windows SSH listener found." }
            [Console]::Write(($ports -join "|"))
          ')"

          last_activity="$(date +%s)"
          idle_timeout_seconds=$(( idle_timeout * 60 ))

          while true; do
            sleep 30
            now="$(date +%s)"

            connections="$(netstat -na)"
            # Match the local endpoint exactly; consume all rows to avoid pipefail/SIGPIPE races.
            if awk -v ports="$runner_ssh_local_ports" '
              $1 == "TCP" && $2 ~ (":(" ports ")$") && $4 ~ /^ESTABLISHED\r?$/ { active = 1 }
              END { exit !active }
            ' <<< "$connections"; then
              last_activity="$now"
            elif [ -f ~/.testbox-last-activity ]; then
              file_mtime="$(stat -c %Y ~/.testbox-last-activity 2>/dev/null || stat -f %m ~/.testbox-last-activity)"
              if [ "$file_mtime" -gt "$last_activity" ]; then
                last_activity="$file_mtime"
              fi
            fi

            idle_seconds=$(( now - last_activity ))
            if [ "$idle_seconds" -ge "$idle_timeout_seconds" ]; then
              echo "Idle timeout reached (${idle_timeout} minutes). Shutting down."
              exit 0
            fi
          done

      - name: Testbox action marker
        if: ${{ false }}
        uses: useblacksmith/run-testbox@3f60ff9ceb2c10c3feefa87dc0c6490cffae059d
