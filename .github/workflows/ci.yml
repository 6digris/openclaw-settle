name: Native Deflake Controls
on:
  workflow_dispatch: {}
run-name: Native deflake controls PR 154269 b43d28e26311 after 35557398853
permissions:
  contents: read
concurrency:
  group: openclaw-native-deflake-proof-154269
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: 24.x
  HISTORICAL_TARGET: "false"
  PROOF_CANDIDATE_SHA: b43d28e26311c973101a405cb46785dcfd40a2a5
  PROOF_TOOLING_SHA: d01d83b79b18fd7700648e97e54db9e133bca46d
  PROOF_BASELINE_SHA: a4e3a5d5f88f164a9565cf805db242b34557d71f
  PROOF_BINDING_SHA256: b3346577234b80a0d68a611b9e4c61805a13ef83217d3947412a2f2f3a00d110
  PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  native-proof:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Start bounded proof envelope
        run: |-
          set -euo pipefail
          python3 -I -S - <<'PYTHON'
          import json, os, re, time
          from pathlib import Path
          for name in ["PROOF_CANDIDATE_SHA", "PROOF_TOOLING_SHA", "PROOF_BASELINE_SHA"]:
              if not re.fullmatch("[0-9a-f]{40}", os.environ[name]):
                  raise RuntimeError("Unbound proof identity: " + name)
          root = Path(os.environ["RUNNER_TEMP"]) / "native-deflake-proof"
          root.mkdir(mode=0o700)
          (root / "dispatch.json").write_text(json.dumps({key: os.environ.get(key) for key in ["PROOF_CANDIDATE_SHA", "PROOF_TOOLING_SHA", "PROOF_WORKFLOW_SHA", "PROOF_BASELINE_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"]}, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PROOF_STARTED_MS=" + str(time.time_ns() // 1000000) + "\n")
          PYTHON
      - name: Prepare trusted Git owner
        uses: openclaw/openclaw/.github/actions/git-owner@d01d83b79b18fd7700648e97e54db9e133bca46d
      - name: Materialize immutable task proof code
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import hashlib, json, os, tempfile
          from pathlib import Path, PurePosixPath
          import ci_git_owner as owner

          scratch = Path(tempfile.mkdtemp(prefix="native-proof-definition-", dir=os.environ["RUNNER_TEMP"]))
          output = Path(os.environ["RUNNER_TEMP"]) / "native-proof-harness"
          output.mkdir(mode=0o700)
          remote = "https://github.com/openclaw/openclaw.git"
          owner.checkout_environment.update(owner.git_auth_environment(remote, os.environ.pop("CHECKOUT_TOKEN", "")))
          try:
              owner.run_git(str(scratch), "init", str(scratch))
              owner.run_git(str(scratch), "remote", "add", "origin", remote)
              owner.fetch(str(scratch), os.environ["PROOF_WORKFLOW_SHA"], max_attempts=1, blobless=True)
              def read(relative):
                  with tempfile.TemporaryFile() as stream:
                      owner.run_git(str(scratch), "show", os.environ["PROOF_WORKFLOW_SHA"] + ":.github/native-deflake-proof/" + relative,
                                    timeout=90, stdout=stream)
                      stream.seek(0)
                      return stream.read()
              raw = read("binding.json")
              if hashlib.sha256(raw).hexdigest() != os.environ["PROOF_BINDING_SHA256"]:
                  raise RuntimeError("Workflow/binding identity mismatch")
              binding = json.loads(raw)
              if binding["candidateSha"] != os.environ["PROOF_CANDIDATE_SHA"] or binding["toolingSha"] != os.environ["PROOF_TOOLING_SHA"]:
                  raise RuntimeError("Candidate/tooling binding mismatch")
              (output / "binding.json").write_bytes(raw)
              for relative, expected in binding["payloadHashes"].items():
                  name = PurePosixPath(relative)
                  if name.is_absolute() or ".." in name.parts:
                      raise RuntimeError("Invalid proof payload path")
                  value = read(relative)
                  if hashlib.sha256(value).hexdigest() != expected:
                      raise RuntimeError("Proof payload hash mismatch: " + relative)
                  target = output / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(value)
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("PROOF_HARNESS_DIR=" + str(output) + "\n")
          finally:
              owner.checkout_environment.clear()
          PYTHON
      - name: Checkout exact reviewed candidate with canonical Git owner
        env:
          CHECKOUT_REPO: ${{ github.repository }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: b43d28e26311c973101a405cb46785dcfd40a2a5
          WORKFLOW_SHA: d01d83b79b18fd7700648e97e54db9e133bca46d
        run: python3 -I -S "$CI_GIT_OWNER"
      - name: Fetch immutable original control source
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import ci_git_owner as owner
          remote = "https://github.com/openclaw/openclaw.git"
          owner.checkout_environment.update(owner.git_auth_environment(remote, os.environ.pop("CHECKOUT_TOKEN", "")))
          try:
              owner.fetch(os.environ["GITHUB_WORKSPACE"], os.environ["PROOF_BASELINE_SHA"], max_attempts=1)
              actual = owner.git_output(os.environ["GITHUB_WORKSPACE"], "rev-parse", os.environ["PROOF_BASELINE_SHA"] + "^{commit}").strip()
              if actual != os.environ["PROOF_BASELINE_SHA"]:
                  raise RuntimeError("Original control source mismatch")
          finally:
              owner.checkout_environment.clear()
          PYTHON
      - name: Setup Node environment for Apple assets
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') != ''
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"
      - name: Install Mermaid renderer dependencies
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') != ''
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --optional --filter '@openclaw/mermaid-renderer...' --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
      - name: Prepare Apple Mermaid assets
        run: |
          set -euo pipefail
          if [[ -f scripts/prepare-apple-mermaid.mjs ]]; then
            node scripts/prepare-apple-mermaid.mjs
          elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
            echo "Frozen target predates bundled Mermaid assets."
          else
            echo "Current CI targets must provide scripts/prepare-apple-mermaid.mjs." >&2
            exit 1
          fi
      - name: Detect Swift toolchain cache key
        id: swift-toolchain
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          swift_version="$(swift --version | head -n 1)"
          toolchain_key="$(printf '%s\n%s\n' "$xcode_version" "$swift_version" | shasum -a 256 | awk '{print $1}')"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Restore Swift build directory cache
        id: swift-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-build-${{ 'tests' == 'tests' && 'v7' || 'v6' }}-${{ 'tests' }}-${{ hashFiles('scripts/swift-build-cache-metadata.py') }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**', 'apps/shared/**/Sources/**', 'apps/swabble/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-${{ 'tests' == 'tests' && 'v7' || 'v6' }}-${{ 'tests' }}-${{ hashFiles('scripts/swift-build-cache-metadata.py') }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}-
      - name: Validate Swift build cache
        id: validate-swift-build-cache
        run: |
          set -euo pipefail
          cache_valid=true
          sparkle_info="apps/macos/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework/Info.plist"
          if [[ -d apps/macos/.build && ! -f "$sparkle_info" ]]; then
            echo "::warning::Swift build cache is missing Sparkle; resetting the local SwiftPM build directory."
            swift package --package-path apps/macos reset
            cache_valid=false
          fi
          echo "cache-valid=$cache_valid" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build input timestamps
        if: steps.validate-swift-build-cache.outputs.cache-valid == 'true' && env.HISTORICAL_TARGET != 'true'
        run: python3 -I -S scripts/swift-build-cache-metadata.py restore
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run remaining causal controls with bound prior clean proof
        run: node "$PROOF_HARNESS_DIR/driver.mjs" --run
      - name: Upload proof logs and immutable source ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-deflake-proof-154269-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-deflake-proof/**/*.log
            ${{ runner.temp }}/native-deflake-proof/**/*.json
            ${{ runner.temp }}/native-deflake-proof/**/*.jsonl
          if-no-files-found: error
          retention-days: 7
