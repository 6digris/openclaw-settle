name: Temporary QA runtime fixture proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/qa-runtime-fixture-proof.yml
      - extensions/qa-lab/src/suite-evidence.test.ts
      - extensions/qa-lab/src/evidence-environment.test.ts
      - extensions/qa-lab/src/code-mode-model-matrix.runtime-identity.test.ts

permissions:
  contents: read

concurrency:
  group: qa-runtime-fixture-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_MAX_WORKERS: "2"
  BASE_SHA: 363313eef78058df922f102e9b01cb77c3116e01
  SOURCE_PINS: '{"extensions/qa-lab/src/suite-evidence.test.ts":"8676c38459ba9221f5f4e3deccfcd6357dee2cc0a96cfee3e993aa2c23aa1667","extensions/qa-lab/src/evidence-environment.test.ts":"72984a2a4064773b5854bcecb0357d50c635dd2986e7b28bb441fb5070c88170","extensions/qa-lab/src/code-mode-model-matrix.runtime-identity.test.ts":"c7fff5f2ba3237e8d7f1c93a8cc19b35133430365603cd102573a17116e7a9bc","extensions/qa-lab/src/test-file-scenario-runner.child-bundle.test.ts":"9512326cc90f0708396e18c5475677556d1f4a4bedfc0ab9c5d5e86249fbff2a"}'

jobs:
  cold-runtime:
    if: github.repository == 'openclaw/openclaw' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/qa-evidence-child-import'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - &identity
        name: Verify exact candidate source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git show --no-patch --format='%H %P'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const expected = ['.github/workflows/qa-runtime-fixture-proof.yml', 'extensions/qa-lab/src/suite-evidence.test.ts', 'extensions/qa-lab/src/evidence-environment.test.ts', 'extensions/qa-lab/src/code-mode-model-matrix.runtime-identity.test.ts'];
          assert.deepEqual(execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, 'HEAD'], {encoding:'utf8'}).trim().split('\n').sort(), expected.sort());
          for (const [file, hash] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            assert.equal(actual, hash, file);
            console.log(`${actual}  ${file}`);
          }
          NODE
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Verify dependency contract and prepare reports
        run: |
          set -euo pipefail
          test "$(node -p process.versions.node)" = 24.19.0
          test "$(pnpm -v)" = 12.3.4
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const [name, version] of [['@openclaw/fs-safe','0.11.0'], ['vitest','5.0.0']]) {
            assert.equal(JSON.parse(readFileSync(`node_modules/${name}/package.json`)).version, version);
            console.log(`${name}@${version}`);
          }
          NODE
          mkdir "$RUNNER_TEMP/qa-runtime-proof"
      - name: Reproduce the cold original fixture failure
        run: |
          set -euo pipefail
          file=extensions/qa-lab/src/suite-evidence.test.ts
          restore_candidate() { git restore --source=HEAD -- "$file"; }
          trap restore_candidate EXIT
          git show "$BASE_SHA:$file" > "$file"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = createHash('sha256').update(readFileSync('extensions/qa-lab/src/suite-evidence.test.ts')).digest('hex');
          assert.equal(hash, 'ba4f7d45c3186c978df54d9a9a00d985c157f8306146090e46def145b9a6fad5');
          console.log(`BASELINE ${hash}`);
          NODE
          set +e
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-qa.config.ts extensions/qa-lab/src/suite-evidence.test.ts -t "carries simulated Bun capture into prepared receipts and preserves explicit anchors" --passWithNoTests=false --reporter=default --reporter=json --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts" --outputFile.json="$RUNNER_TEMP/qa-runtime-proof/baseline.json"
          status=$?
          set -e
          restore_candidate
          trap - EXIT
          test "$status" = 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const file = `${process.env.RUNNER_TEMP}/qa-runtime-proof/baseline.json`;
          const report = JSON.parse(readFileSync(file));
          const capture = JSON.parse(readFileSync(`${file}.capture.json`));
          assert.equal(report.numPassedTests, 0);
          assert.equal(report.numFailedTests, 1);
          assert.equal(report.numPendingTests, 8);
          const failed = report.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'failed');
          assert.equal(failed.length, 1);
          assert.equal(failed[0].title, 'carries simulated Bun capture into prepared receipts and preserves explicit anchors');
          assert.match(failed[0].failureMessages.join('\n'), /TypeError: process\.once is not a function/);
          assert.deepEqual(capture.modules.map(module => path.relative(process.cwd(), module.file)), ['extensions/qa-lab/src/suite-evidence.test.ts']);
          assert.equal(capture.processTimedOut, false);
          assert.equal(capture.passWithNoTests, false);
          assert.equal(capture.ignoreUnhandledErrors, false);
          assert.equal(capture.ended.unhandledErrors, 0);
          assert.equal(capture.ended.suiteErrors, 0);
          assert.equal(capture.ended.failedModules, 1);
          console.log('BASELINE EXPECTED FAILURE: cold fixture loses process.once; candidate restored.');
          NODE
      - *identity
      - name: Candidate cold fixture in a fresh process
        run: >-
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-qa.config.ts
          extensions/qa-lab/src/suite-evidence.test.ts
          -t "carries simulated Bun capture into prepared receipts and preserves explicit anchors"
          --passWithNoTests=false --reporter=default --reporter=json
          --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts"
          --outputFile.json="$RUNNER_TEMP/qa-runtime-proof/cold.json"
      - name: Complete occurrence and runtime identity fixtures
        run: >-
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-qa.config.ts
          extensions/qa-lab/src/suite-evidence.test.ts
          extensions/qa-lab/src/evidence-environment.test.ts
          extensions/qa-lab/src/code-mode-model-matrix.runtime-identity.test.ts
          --passWithNoTests=false --reporter=default --reporter=json
          --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts"
          --outputFile.json="$RUNNER_TEMP/qa-runtime-proof/full.json"
      - name: Verify exact tests and completed captures
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const root = `${process.env.RUNNER_TEMP}/qa-runtime-proof`;
          const baseline = JSON.parse(readFileSync(`${root}/baseline.json.capture.json`));
          for (const [name, passed, pending, files] of [
            ['cold', 1, 8, ['extensions/qa-lab/src/suite-evidence.test.ts']],
            ['full', 19, 0, ['extensions/qa-lab/src/suite-evidence.test.ts', 'extensions/qa-lab/src/evidence-environment.test.ts', 'extensions/qa-lab/src/code-mode-model-matrix.runtime-identity.test.ts']],
          ]) {
            const report = JSON.parse(readFileSync(`${root}/${name}.json`));
            const capture = JSON.parse(readFileSync(`${root}/${name}.json.capture.json`));
            assert.equal(report.success, true);
            assert.equal(report.numPassedTests, passed);
            assert.equal(report.numPendingTests, pending);
            assert.equal(report.numFailedTests, 0);
            assert.notEqual(capture.pid, baseline.pid);
            assert.deepEqual(capture.modules.map(module => path.relative(process.cwd(), module.file)).sort(), files.sort());
            assert(capture.modules.every(module => path.relative(process.cwd(), module.config) === 'test/vitest/vitest.extension-qa.config.ts'));
            assert.equal(capture.processTimedOut, false);
            assert.equal(capture.passWithNoTests, false);
            assert.equal(capture.ignoreUnhandledErrors, false);
            assert.equal(capture.ended.unhandledErrors, 0);
            assert.equal(capture.ended.suiteErrors, 0);
            assert.equal(capture.ended.failedModules, 0);
            const tests = report.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'passed');
            assert(tests.some(test => test.title === 'carries simulated Bun capture into prepared receipts and preserves explicit anchors'));
            if (name === 'cold') assert.equal(tests.length, 1);
            console.log(JSON.stringify({suite:name,files:files.length,passed,pending}));
          }
          NODE
      - *identity
      - name: Validate bounded report export
        if: always()
        id: reports
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { lstatSync, readdirSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const root = `${process.env.RUNNER_TEMP}/qa-runtime-proof`;
          const files = readdirSync(root);
          assert(files.length > 0 && files.length <= 6);
          let bytes = 0;
          for (const name of files) {
            const stat = lstatSync(path.join(root, name));
            assert(stat.isFile());
            bytes += stat.size;
          }
          assert(bytes <= 16 * 1024 * 1024);
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          console.log(JSON.stringify({files:files.length,bytes}));
          NODE
      - name: Retain produced reports
        if: always() && steps.reports.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-runtime-fixture-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/qa-runtime-proof
          if-no-files-found: error
          retention-days: 7
