# Diagnostic branch only; do not merge this workflow replacement into main.
name: Windows lifecycle observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/codex/windows-lifecycle-observation'
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "4"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Match the original Defender setup
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
          } catch {
            Write-Warning "Defender exclusions unavailable; continuing as in the original CI row."
          }
      - name: Setup original Node runtime
        env:
          REQUESTED_NODE_VERSION: "24.19.0"
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "$REQUESTED_NODE_VERSION"
      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: off
          node-version: "24.19.0"
      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
      - name: Observe the original row and standalone owner
        id: proof
        env:
          CI: "true"
          EXPECTED_PROBE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'PROBE'
          import { execFileSync, spawnSync } from "node:child_process";
          import { appendFileSync, mkdtempSync, writeFileSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== process.env.EXPECTED_PROBE_SHA || process.platform !== "win32" || process.version !== "v24.19.0") {
            throw new Error("Diagnostic source or native runtime differs from the binding");
          }
          const evidence = mkdtempSync(path.join(process.env.RUNNER_TEMP, "wl-"));
          appendFileSync(process.env.GITHUB_OUTPUT, "evidence_root=" + evidence + "\n");
          const metadata = {
            head,
            baseline: "21273684d49ee0e264a1bd381528071ec6a8ea7b",
            platform: process.platform,
            version: process.version,
            availableParallelism: os.availableParallelism(),
            totalMemoryBytes: os.totalmem(),
            originalRun: 35601700904,
            originalJob: 106339914333,
          };
          console.log(JSON.stringify(metadata));
          writeFileSync(path.join(evidence, "binding.json"), JSON.stringify(metadata, null, 2));
          const targets = ["extensions/msteams/src/media-helpers.test.ts", "extensions/msteams/src/messenger.test.ts", "src/cli/completion-runtime.windows.test.ts", "src/cli/daemon-cli/status.print.test.ts", "src/cli/update-cli/restart-helper.windows.test.ts", "src/gateway/control-ui-asset-retention.publication.test.ts", "src/gateway/gateway-cron-process-identity.windows.test.ts", "src/gateway/worker-environments/workspace-quiescence.windows.test.ts", "src/infra/update-managed-service-handoff-lifecycle.test.ts", "src/utils.test.ts", "test/helpers/openclaw-test-instance.test.ts", "test/scripts/check-openclaw-package-tarball.test.ts", "test/scripts/direct-run-entrypoints.test.ts", "test/scripts/openclaw-cross-os-installer.windows.test.ts", "test/scripts/windows-blacksmith-testbox.test.ts", "test/scripts/write-plugin-sdk-entry-dts.test.ts"];
          const results = [];
          // Only test processes use this directory; checkout/setup credentials remain outside it.
          const env = { ...process.env, TMP: evidence, TEMP: evidence, TMPDIR: evidence };
          for (const [label, files] of [["original-row", targets], ["standalone-owner", ["test/helpers/openclaw-test-instance.test.ts"]]]) {
            const startedAt = Date.now();
            console.log("BEGIN " + label);
            const result = spawnSync(process.execPath, ["--import", "./scripts/tsx.mjs", "scripts/test-projects.mts", ...files, "--fileParallelism"], { env, stdio: "inherit" });
            const receipt = { label, status: result.status, signal: result.signal, error: result.error?.message, wallMs: Date.now() - startedAt };
            results.push(receipt);
            writeFileSync(path.join(evidence, "results.json"), JSON.stringify(results, null, 2));
            console.log(JSON.stringify(receipt));
          }
          process.exitCode = results.some((result) => result.status !== 0) ? 1 : 0;
          PROBE
      - name: Preserve diagnostic receipts and retained test inputs
        if: always() && steps.proof.outputs.evidence_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.proof.outputs.evidence_root }}
          include-hidden-files: true
          if-no-files-found: error
