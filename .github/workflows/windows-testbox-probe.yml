name: Windows Testbox Probe
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      package_binding:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native-upgrade:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - name: Qualify fresh native runner isolation
        id: native_isolation
        shell: pwsh
        env:
          NATIVE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $proofPath = Join-Path $env:RUNNER_TEMP "windows-schtasks-isolation.json"
          $evidence = [ordered]@{ result = "unqualified"; runnerEnvironment = $env:NATIVE_RUNNER_ENVIRONMENT; image = $env:ImageOS }
          try {
            # Standard GitHub-hosted Windows jobs receive a fresh VM per job.
            # ImageOS also names toolchain variants; it is evidence, not isolation authority.
            if ($env:NATIVE_RUNNER_ENVIRONMENT -ne "github-hosted" -or $env:RUNNER_OS -ne "Windows") {
              throw "Expected a newly allocated GitHub-hosted Windows runner."
            }
            if ($env:EXPECTED_HEAD -cne "71aede4c4e4a0d04a3228d18fd81d0f376d4ac16") {
              throw "Native proof requires an exact 40-character target_ref."
            }
            # Actions artifact/cache credentials are infrastructure-only. The
            # native probe separately bounds its environment before owner imports.
            $credentialNames = @(
              "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY", "GOOGLE_API_KEY",
              "GITHUB_TOKEN", "GH_TOKEN", "NPM_TOKEN", "NODE_AUTH_TOKEN",
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_WEB_IDENTITY_TOKEN_FILE",
              "AZURE_CLIENT_SECRET", "AZURE_FEDERATED_TOKEN_FILE", "ARM_CLIENT_SECRET", "GOOGLE_APPLICATION_CREDENTIALS",
              "SSH_AUTH_SOCK", "NODE_OPTIONS", "NODE_EXTRA_CA_CERTS",
              "OPENCLAW_HOME", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH",
              "OPENCLAW_GATEWAY_TOKEN", "OPENCLAW_GATEWAY_PASSWORD", "OPENCLAW_SUPERVISOR_MODE"
            ) | Where-Object { -not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($_)) }
            $credentialNames = @($credentialNames)
            $evidence.forwardedCredentialCount = $credentialNames.Count
            if ($credentialNames.Count -ne 0) { throw "Forwarded credential environment is not permitted." }
            $tailnetServices = @(Get-Service | Where-Object { $_.Name -match 'tailscale|zerotier' })
            $tailnetAdapters = @(Get-NetAdapter -IncludeHidden | Where-Object { $_.InterfaceDescription -match 'tailscale|zerotier' })
            $tailnetRoutes = @(Get-NetRoute | Where-Object { $_.DestinationPrefix -eq '100.64.0.0/10' })
            $networkDisks = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=4")
            $networkDrives = @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.DisplayRoot -like '\\*' })
            $smbMappings = @(Get-SmbMapping)
            $evidence.tailnetSurfaceCount = $tailnetServices.Count + $tailnetAdapters.Count + $tailnetRoutes.Count
            $evidence.operatorMountCount = $networkDisks.Count + $networkDrives.Count + $smbMappings.Count
            if ($evidence.tailnetSurfaceCount -ne 0 -or $evidence.operatorMountCount -ne 0) {
              throw "Native proof requires no Tailnet attachment or operator network mounts."
            }
            # Do not use proxies, follow redirects, or read a successful token
            # response. Unknown/temporary failures do not establish no identity.
            $handler = [Net.Http.HttpClientHandler]::new()
            $handler.UseProxy = $false
            $handler.AllowAutoRedirect = $false
            $client = [Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(5)
            $deadline = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(5))
            $client.DefaultRequestHeaders.Add("Metadata", "true")
            try {
              $uri = "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F"
              $response = $client.GetAsync($uri, [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $deadline.Token).GetAwaiter().GetResult()
              try {
                $evidence.managedIdentityStatus = [int]$response.StatusCode
                if ([int]$response.StatusCode -ne 400) { throw "Managed identity absence is unproven." }
                $body = $response.Content.ReadAsStringAsync($deadline.Token).GetAwaiter().GetResult() | ConvertFrom-Json
                # Accept only this known negative; changed error wording blocks
                # qualification instead of treating every 400 as no identity.
                if ($body.access_token -or $body.error -ne "invalid_request" -or $body.error_description -cne "Identity not found") {
                  throw "Managed identity absence is unproven."
                }
                $evidence.managedIdentity = "explicit-identity-not-found"
              } finally {
                $body = $null
                $response.Dispose()
              }
            } catch {
              # Never include endpoint bodies or exception data in logs/artifacts.
              throw "IMDS did not establish identity absence; native product execution is blocked."
            } finally {
              $deadline.Dispose()
              $client.Dispose()
            }
            $evidence.result = "qualified"
          } finally {
            $evidence | ConvertTo-Json | Set-Content -LiteralPath $proofPath
          }

      - name: Preflight native Scheduled Task session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $sessionId = (Get-Process -Id $PID).SessionId
          Write-Host "identity=$($identity.Name)"
          Write-Host "session_id=$sessionId"
          Write-Host "user_interactive=$([Environment]::UserInteractive)"
          Write-Host "administrator=$isAdmin"
          query user 2>&1 | Write-Host
          if (-not [Environment]::UserInteractive) {
            throw "Native Scheduled Task proof requires an interactive Windows runner session."
          }
          exit 0


      - name: Checkout exact qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .maintainer/pr-119052

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"

      - name: Verify immutable package producer
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BINDING: ${{ inputs.package_binding }}
        run: |
          $ErrorActionPreference = "Stop"
          $b = $env:PACKAGE_BINDING | ConvertFrom-Json
          foreach ($key in @("runId","runAttempt","artifactId","producerJobId","integrityJobId")) {
            if ([string]$b.$key -notmatch '^[1-9][0-9]*$') { throw "Invalid numeric package binding" }
          }
          if ($b.sourceSha -cne "71aede4c4e4a0d04a3228d18fd81d0f376d4ac16" -or $b.workflowSha -cne "9343ea4099ba46475db5fdc5e7293d4db65f4e68") { throw "Wrong package source or producer" }
          if ($b.packageSha256 -cnotmatch '^[0-9a-f]{64}$' -or $b.artifactDigest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid digest" }
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($b.runId)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect package producer" }
          $producer = ($raw -join [Environment]::NewLine) | ConvertFrom-Json
          if ($producer.head_sha -cne $b.workflowSha -or $producer.run_attempt -ne $b.runAttempt -or $producer.path -ne ".github/workflows/package-acceptance.yml") { throw "Producer not accepted" }
          # The immutable package and its integrity check are producer gates.
          # Separate install/Docker consumers may still be running in this workflow.
          foreach ($gate in @(@{ id = $b.producerJobId; name = "Resolve package candidate" }, @{ id = $b.integrityJobId; name = "Package integrity" })) {
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$($gate.id)"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect package producer gate" }
            $job = ($raw -join [Environment]::NewLine) | ConvertFrom-Json
            if ($job.run_id -ne $b.runId -or $job.run_attempt -ne $b.runAttempt -or $job.name -cne $gate.name -or $job.status -cne "completed" -or $job.conclusion -cne "success") { throw "Package producer gate not accepted" }
          }
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($b.artifactId)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect artifact" }
          $artifact = ($raw -join [Environment]::NewLine) | ConvertFrom-Json
          if ($artifact.expired -or $artifact.workflow_run.id -ne $b.runId -or $artifact.digest -cne $b.artifactDigest -or $artifact.name -cne "package-under-test-$($b.runId)-$($b.runAttempt)") { throw "Artifact mismatch" }
          $b | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP "pr119052-upgrade-binding.json")
          "artifact_id=$($b.artifactId)" >> $env:GITHUB_OUTPUT
          "run_id=$($b.runId)" >> $env:GITHUB_OUTPUT

      - name: Download candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.package.outputs.artifact_id }}
          run-id: ${{ steps.package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .candidate-package

      - name: Run published Windows updater into candidate
        id: upgrade
        timeout-minutes: 55
        shell: pwsh
        env:
          PACKAGE_BINDING: ${{ inputs.package_binding }}
        run: |
          $ErrorActionPreference = "Stop"
          $b = $env:PACKAGE_BINDING | ConvertFrom-Json
          $package = Join-Path $env:GITHUB_WORKSPACE ".candidate-package/openclaw-current.tgz"
          $metadata = Get-Content (Join-Path $env:GITHUB_WORKSPACE ".candidate-package/package-candidate.json") -Raw | ConvertFrom-Json
          if ($metadata.packageSourceSha -cne $b.sourceSha -or $metadata.sha256 -cne $b.packageSha256) { throw "Candidate metadata mismatch" }
          if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -cne $b.packageSha256) { throw "Candidate package hash mismatch" }
          $driver = Join-Path $env:GITHUB_WORKSPACE ".maintainer/pr-119052/RUN-PUBLISHED-UPGRADE.mjs"
          if ((Get-FileHash $driver -Algorithm SHA256).Hash.ToLowerInvariant() -cne "463b6e20e3c75f293afdc488229551b36b59a70258eb64f43f1569833cf9a419") { throw "Driver bytes differ from review" }
          $npmCli = Join-Path (Split-Path (Get-Command node.exe).Source) "node_modules/npm/bin/npm-cli.js"
          if (-not (Test-Path $npmCli)) { throw "Missing installed npm CLI" }
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:RUNNER_TEMP).Substring(0,1))
          if ($drive.Free -lt 8589934592) { throw "Measured disk cannot fit two install generations and cache" }
          $proof = Join-Path $env:RUNNER_TEMP "pr119052-published-upgrade-proof"
          node $driver $package $b.packageSha256 $b.sourceSha $npmCli $proof
          if ($LASTEXITCODE -ne 0) { throw "Published-updater compatibility failed" }
          $result = Get-Content (Join-Path $proof "proof.json") -Raw | ConvertFrom-Json
          if ($result.status -cne "PASS" -or $result.cells.Count -ne 2 -or -not $result.cleanup.capturedActionHostsAbsent -or -not $result.cleanup.taskAbsent -or -not $result.cleanup.processesAbsent -or -not $result.cleanup.portReusable -or -not $result.cleanup.stateRemoved -or $result.cleanup.errors.Count -ne 0) { throw "Native proof or cleanup incomplete" }

      - name: Upload native upgrade evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr119052-published-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-schtasks-isolation.json
            ${{ runner.temp }}/pr119052-upgrade-binding.json
            ${{ runner.temp }}/pr119052-published-upgrade-proof/*.json
            ${{ runner.temp }}/pr119052-published-upgrade-proof/*.log
          if-no-files-found: error
          retention-days: 7
