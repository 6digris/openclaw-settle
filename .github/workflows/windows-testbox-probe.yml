name: Windows Testbox Probe
run-name: PR148066 read-only missing-task phase diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-task-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed proof revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .maintainer/pr-148066
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
      - name: Verify reviewed driver bytes
        shell: cmd
        run: node -e "const fs=require('fs'),c=require('crypto');for(const [f,h] of Object.entries({'run.mjs':'ee4e37cb8fe134848b7ebc6b59558899df4cd1c5481e28cd05bdc9264e8d709a','probe.mjs':'c69abd7146e58a06c855906511c50528ed5635f75716b587960786d8a954ddc0','loader.mjs':'b5918bda5cdcf5b32efc6a506b7101987d60c2fc7b0b1c2cc37506d86d014fc3','source-manifest.json':'eb78580e24003012939a1e21ba33f02bf2dc7ddc6d6e27cc308c2a640f4d456a'})){if(c.createHash('sha256').update(fs.readFileSync('.maintainer/pr-148066/'+f)).digest('hex')!==h)throw Error('reviewed hash mismatch '+f)}"
      - name: Read-only original and instrumented missing-task probes
        shell: cmd
        env:
          DIAGNOSTIC_ORDER: ${{ matrix.order }}
        run: node .maintainer/pr-148066/run.mjs %DIAGNOSTIC_ORDER%
      - name: Upload bounded diagnostics including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr148066-windows-${{ matrix.order }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr148066-windows-${{ matrix.order }}/*
          if-no-files-found: error
          retention-days: 7
