name: Apple Watch Metadata Probe
run-name: Apple Watch metadata (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-watch-metadata-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Observe installed Watch simulator capabilities
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys

          failures = []

          def emit(probe, outcome="observed", **fields):
              print(json.dumps({"probe": probe, "outcome": outcome, **fields}, sort_keys=True), flush=True)

          def fail(probe, outcome, **fields):
              failures.append(probe)
              emit(probe, outcome, **fields)

          def capture(probe, arguments, timeout=15):
              try:
                  result = subprocess.run(
                      arguments, stdin=subprocess.DEVNULL, capture_output=True,
                      text=True, timeout=timeout, check=False,
                  )
              except FileNotFoundError:
                  fail(probe, "executable-missing")
                  return None
              except subprocess.TimeoutExpired:
                  fail(probe, "timed-out", timeoutSeconds=timeout)
                  return None
              except (OSError, UnicodeError):
                  fail(probe, "capture-failed")
                  return None
              if result.returncode != 0:
                  fail(probe, "command-failed", exitCode=result.returncode)
                  return None
              return result

          def items(probe, arguments, key, timeout=15):
              result = capture(probe, arguments, timeout)
              if result is None:
                  return None
              try:
                  value = json.loads(result.stdout)[key]
                  if not isinstance(value, list) or not all(isinstance(row, dict) for row in value):
                      raise ValueError()
                  return value
              except (ValueError, KeyError, TypeError):
                  fail(probe, "unrecognized-metadata", exitCode=0)
                  return None

          # Only allowlisted fields reach the log; raw output may contain device identities.
          developer = os.environ["DEVELOPER_DIR"]
          if not os.path.isdir(developer):
              fail("xcode", "approved-path-missing")
              sys.exit(1)
          for tool in ("xcodebuild", "swift", "simctl"):
              probe = "resolve-" + tool
              result = capture(probe, ["/usr/bin/xcrun", "--find", tool])
              if result is not None:
                  resolved = result.stdout.strip()
                  inside = resolved.startswith(developer + "/") and os.access(resolved, os.X_OK)
                  if inside:
                      emit(probe, exitCode=0, approvedXcode=True)
                  else:
                      fail(probe, "outside-approved-xcode", exitCode=0)
          if failures:
              sys.exit(1)

          result = capture("xcode", ["/usr/bin/xcrun", "xcodebuild", "-version"])
          if result is None:
              sys.exit(1)
          version = re.fullmatch(r"Xcode (26\.6(?:\.\d+)?)\nBuild version ([A-Za-z0-9]+)\s*", result.stdout)
          if version is None:
              fail("xcode", "unexpected-version", exitCode=0)
              sys.exit(1)
          emit("xcode", exitCode=0, version=version[1], build=version[2])
          emit("python", version=".".join(str(part) for part in sys.version_info[:3]))

          for probe, arguments, pattern in (
              ("macos", ["/usr/bin/sw_vers", "-productVersion"], r"^(\d+(?:\.\d+){1,2})\s*$"),
              ("swift", ["/usr/bin/xcrun", "swift", "--version"], r"Apple Swift version (\d+(?:\.\d+){1,2})"),
          ):
              result = capture(probe, arguments)
              if result is not None:
                  version = re.search(pattern, result.stdout)
                  if version:
                      emit(probe, exitCode=0, version=version[1])
                  else:
                      fail(probe, "unrecognized-version", exitCode=0)

          for command, tokens in (
              ("keychain", ("add-root-cert", "add-cert", "reset")),
              ("privacy", ("grant", "revoke", "reset", "microphone")),
              ("io", ("enumerate", "poll", "screenshot", "recordVideo", "recordAudio", "playAudio", "audio", "microphone")),
          ):
              probe = "simctl-help-" + command
              result = capture(probe, ["/usr/bin/xcrun", "simctl", "help", command])
              if result is not None:
                  text = result.stdout + "\n" + result.stderr
                  mentioned = [token for token in tokens if re.search(r"(?<![\w-])" + re.escape(token) + r"(?![\w-])", text)]
                  emit(probe, exitCode=0, helpMentions=mentioned)

          runtimes = items("watch-runtimes", ["/usr/bin/xcrun", "simctl", "list", "runtimes", "--json"], "runtimes")
          if runtimes is not None:
              selected = []
              for runtime in runtimes:
                  if not str(runtime.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.watchOS-"):
                      continue
                  version = runtime.get("version")
                  build = runtime.get("buildversion")
                  available = runtime.get("isAvailable")
                  if (not isinstance(version, str) or not re.fullmatch(r"\d+(?:\.\d+){1,2}", version)
                          or not isinstance(build, str) or not re.fullmatch(r"[A-Za-z0-9]+", build)
                          or not isinstance(available, bool)):
                      fail("watch-runtimes", "unrecognized-metadata", exitCode=0)
                      break
                  selected.append({"version": version, "build": build, "available": available})
              else:
                  emit("watch-runtimes", exitCode=0, runtimes=sorted(selected, key=lambda row: (row["version"], row["build"])))

          types = items("watch-device-types", ["/usr/bin/xcrun", "simctl", "list", "devicetypes", "--json"], "devicetypes")
          if types is not None:
              ranges = collections.Counter()
              for device_type in types:
                  if device_type.get("productFamily") != "Apple Watch":
                      continue
                  minimum = device_type.get("minRuntimeVersionString")
                  maximum = device_type.get("maxRuntimeVersionString")
                  if not all(isinstance(value, str) and re.fullmatch(r"\d+(?:\.\d+){1,2}", value) for value in (minimum, maximum)):
                      fail("watch-device-types", "unrecognized-metadata", exitCode=0)
                      break
                  ranges[(minimum, maximum)] += 1
              else:
                  emit("watch-device-types", exitCode=0, installedTypeCount=sum(ranges.values()),
                       runtimeRanges=[{"minimum": low, "maximum": high, "count": count} for (low, high), count in sorted(ranges.items())])

          audio = items(
              "audio-inputs",
              ["/usr/sbin/system_profiler", "-json", "-detailLevel", "mini", "-timeout", "10", "SPAudioDataType"],
              "SPAudioDataType", timeout=30,
          )
          if audio is not None:
              try:
                  inputs = 0
                  for group in audio:
                      devices = group["_items"]
                      if not isinstance(devices, list):
                          raise ValueError()
                      for device in devices:
                          channels = device.get("coreaudio_device_input")
                          if channels is not None:
                              if not re.fullmatch(r"\d+", str(channels)):
                                  raise ValueError()
                              inputs += int(channels) > 0
                  # Enumeration is not microphone permission, activation, or voice-flow proof.
                  emit("audio-inputs", exitCode=0, reportedInputCount=inputs,
                       availability="reported" if inputs else "not-reported")
              except (ValueError, KeyError, TypeError, AttributeError):
                  fail("audio-inputs", "unrecognized-metadata", exitCode=0)

          emit("summary", failedProbes=failures)
          sys.exit(bool(failures))
          PY
