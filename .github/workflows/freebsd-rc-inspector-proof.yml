name: Temporary FreeBSD inspector proof

on:
  pull_request:
    paths:
      - scripts/freebsd-service-inspect.mjs
      - scripts/test-freebsd-service-inspect.mjs
      - .github/workflows/freebsd-rc-inspector-proof.yml

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/freebsd-service-inspect.mjs
            /scripts/test-freebsd-service-inspect.mjs
      - name: Bind sources to the PR head
        id: source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "inspector=$(sha256sum scripts/freebsd-service-inspect.mjs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "fixture=$(sha256sum scripts/test-freebsd-service-inspect.mjs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD^)" = f72129f25b4acd0174726205fc75e620ccab7c6a
          git show f72129f25b4acd0174726205fc75e620ccab7c6a:scripts/freebsd-service-inspect.mjs > scripts/.freebsd-service-inspect-baseline.mjs
          echo '136dfb631c750c1432d62bc06173aa4cb3f22fb6c2ddef4a71fbf845bb5b9f5e  scripts/.freebsd-service-inspect-baseline.mjs' | sha256sum --check
      - name: Run isolated native discovery cases
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          INSPECTOR_SHA: ${{ steps.source.outputs.inspector }}
          FIXTURE_SHA: ${{ steps.source.outputs.fixture }}
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA INSPECTOR_SHA FIXTURE_SHA
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 ca_root_nss
          run: |
            set -eu
            verify_sources() {
              test "$(sha256 -q scripts/freebsd-service-inspect.mjs)" = "$INSPECTOR_SHA"
              test "$(sha256 -q scripts/test-freebsd-service-inspect.mjs)" = "$FIXTURE_SHA"
            }
            freebsd-version
            node --version
            printf 'source=%s inspector=%s fixture=%s\n' "$SOURCE_SHA" "$INSPECTOR_SHA" "$FIXTURE_SHA"
            verify_sources
            test "$(sha256 -q scripts/.freebsd-service-inspect-baseline.mjs)" = 136dfb631c750c1432d62bc06173aa4cb3f22fb6c2ddef4a71fbf845bb5b9f5e
            proof_dir=$(mktemp -d /tmp/openclaw-inspector-baseline.XXXXXX)
            cp scripts/freebsd-service-inspect.mjs "$proof_dir/candidate.mjs"
            trap 'cp "$proof_dir/candidate.mjs" scripts/freebsd-service-inspect.mjs; rm -rf "$proof_dir"' EXIT
            cp scripts/.freebsd-service-inspect-baseline.mjs scripts/freebsd-service-inspect.mjs
            set +e
            node scripts/test-freebsd-service-inspect.mjs --escaped-pipe-only > "$proof_dir/baseline.log" 2>&1
            baseline_status=$?
            set -e
            cp "$proof_dir/candidate.mjs" scripts/freebsd-service-inspect.mjs
            verify_sources
            cat "$proof_dir/baseline.log"
            test "$baseline_status" -eq 1
            test "$(grep -c '^CASE ' "$proof_dir/baseline.log")" -eq 1
            grep -Fx 'CASE deadline closes captures held by an escaped daemon' "$proof_dir/baseline.log"
            grep -F 'spawnSync /usr/sbin/chroot ETIMEDOUT' "$proof_dir/baseline.log"
            grep -Fx 'escaped-pipe-holder cleanup=complete' "$proof_dir/baseline.log"
            grep -Fx 'fixture-cleanup=complete' "$proof_dir/baseline.log"
            if grep -q '^PASS ' "$proof_dir/baseline.log"; then exit 1; fi
            echo 'prior helper: escaped-pipe deadline failure confirmed; cleanup complete'
            node scripts/test-freebsd-service-inspect.mjs
            verify_sources
            # The disposable GitHub-hosted runner owns VM teardown. No retained
            # Crabbox lease, VM image cache, or copyback artifact is created.
