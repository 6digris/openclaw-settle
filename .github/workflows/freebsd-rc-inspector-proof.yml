name: Temporary FreeBSD inspector proof

on:
  pull_request:
    paths:
      - scripts/freebsd-service-inspect.mjs
      - scripts/test-freebsd-service-inspect.mjs
      - .github/workflows/freebsd-rc-inspector-proof.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.16.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Check changed script and documentation formatting
        run: pnpm format:check scripts/freebsd-service-inspect.mjs scripts/test-freebsd-service-inspect.mjs docs/install/updating.md package.json .github/workflows/freebsd-rc-inspector-proof.yml
      - name: Lint standalone scripts
        run: node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.scripts.json scripts/freebsd-service-inspect.mjs scripts/test-freebsd-service-inspect.mjs
      - name: Build OpenClaw
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build
      - name: Verify source remains unchanged
        run: git diff --exit-code

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/freebsd-service-inspect.mjs
            /scripts/test-freebsd-service-inspect.mjs
      - name: Bind sources to the PR head
        id: source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "inspector=$(sha256sum scripts/freebsd-service-inspect.mjs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "fixture=$(sha256sum scripts/test-freebsd-service-inspect.mjs | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Run isolated native discovery cases
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          INSPECTOR_SHA: ${{ steps.source.outputs.inspector }}
          FIXTURE_SHA: ${{ steps.source.outputs.fixture }}
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 6144
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA INSPECTOR_SHA FIXTURE_SHA
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 ca_root_nss
          run: |
            set -eu
            verify_sources() {
              test "$(sha256 -q scripts/freebsd-service-inspect.mjs)" = "$INSPECTOR_SHA"
              test "$(sha256 -q scripts/test-freebsd-service-inspect.mjs)" = "$FIXTURE_SHA"
            }
            freebsd-version
            node --version
            printf 'source=%s inspector=%s fixture=%s\n' "$SOURCE_SHA" "$INSPECTOR_SHA" "$FIXTURE_SHA"
            verify_sources
            node scripts/test-freebsd-service-inspect.mjs
            verify_sources
            # The disposable GitHub-hosted runner owns VM teardown. No retained
            # Crabbox lease, VM image cache, or copyback artifact is created.
