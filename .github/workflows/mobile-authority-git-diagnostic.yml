name: Mobile Authority Git Diagnostic

# Branch-only, public-read diagnostic. Never release qualification or publication.
on:
  push:
    branches:
      - diagnostic/mobile-authority-git-20260914-e3b9b381
    paths:
      - .github/workflows/mobile-authority-git-diagnostic.yml
      - scripts/ci/mobile-authority-git-diagnostic.mjs

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [baseline, control]
    steps:
      - name: Require provisioned tools without installation fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-authority-git-artifacts"
          git --version >"$RUNNER_TEMP/mobile-authority-git-artifacts/provisioned-git.txt"
          test "$(git --version)" = 'git version 2.55.0'
          test "$RUNNER_OS/$RUNNER_ARCH" = 'Linux/X64'
          # setup-node must find a completed cache entry, not download a runtime.
          test -f "$RUNNER_TOOL_CACHE/node/24.19.0/x64.complete"
          test "$("$RUNNER_TOOL_CACHE/node/24.19.0/x64/bin/node" --version)" = 'v24.19.0'

      - name: Select already provisioned Node before checking out source
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ""

      - name: Checkout only the diagnostic helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci/mobile-authority-git-diagnostic.mjs
          path: diagnostic-source
          show-progress: false

      - name: Measure public Git fixture with the original Node wrapper
        shell: bash
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.19.0'
          test "$(git --version)" = 'git version 2.55.0'
          test "$(git -C diagnostic-source rev-parse HEAD)" = "$GITHUB_SHA"
          # A 1 GiB per-file ceiling also bounds an unexpectedly large pack.
          # The helper additionally watches trace/archive sizes and free disk.
          ulimit -f 1048576
          node diagnostic-source/scripts/ci/mobile-authority-git-diagnostic.mjs

      - name: Upload diagnostic evidence (not release qualification)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-authority-git-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-authority-git-artifacts
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
