title: Slack shared progress cancel lifecycle
scenario:
  id: slack-shared-progress-cancel
  surface: channels
  coverage:
    primary:
      - agent-runtime.streaming-replies
  execution:
    kind: flow
    channel: slack
    providerMode: mock-openai
    runtime: openclaw
    timeoutMs: 360000
    retryCount: 0
    suiteIsolation: isolated
    isolationReason: Owns a live conversation and cancels only its synthetic workers.
    config:
      requiredChannelDriver: live
      requiredProvider: mock-openai
      requiredModel: shared-progress-fixture-v1
    summary: >-
      Opt-in only. Start scripts/e2e/lib/shared-progress/provider.mjs with MOCK_PORT and
      MOCK_REQUEST_LOG. Pass --model mock-openai/shared-progress-fixture-v1; this synthetic
      model keeps the scenario out of ordinary default lanes.
      Set OPENCLAW_QA_SHARED_PROGRESS_ROOT to the absolute scripts/e2e/lib/shared-progress
      directory, OPENCLAW_QA_SHARED_PROGRESS_RUN,
      and OPENCLAW_QA_SHARED_PROGRESS_PROVIDER_URL. The maintained Slack adapter owns
      the lease and Gateway lifecycle; no external model credentials are used.
flow:
  module: ./live-transports/slack/shared-progress-scenario.js
  call: runSlackSharedProgressScenario
  args:
    - { expr: slackScenarioContext }
    - cancel
